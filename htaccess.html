<title>.htaccess规则生成（301、防盗链）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
textarea{width:100%;height:260px;padding:12px;border:1px solid #ddd;border-radius:6px;margin-top:10px;font-family:monospace}
</style>

<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>.htaccess 规则生成：301重定向、图片防盗链</h2>
<select id="htMode">
<option value="301">域名301跳转（www跳转不带www）</option>
<option value="hotlink">图片防盗链</option>
<option value="htmlhide">隐藏.html后缀</option>
</select>
<input id="domainInput" placeholder="填写主域名 example.com">
<button onclick="genHtaccess()">生成规则</button>
<textarea id="htOutput" readonly></textarea>
<script>
function genHtaccess(){
  const mode = document.getElementById('htMode').value;
  const domain = document.getElementById('domainInput').value.trim();
  let rule = "";
  if(mode==="301"){
rule = `RewriteEngine On
RewriteCond %{HTTP_HOST} ^www.${domain}$ [NC]
RewriteRule ^(.*)$ https://${domain}/$1 [L,R=301]`;
  }else if(mode==="hotlink"){
rule = `RewriteEngine On
RewriteCond %{HTTP_REFERER} !^$
RewriteCond %{HTTP_REFERER} !https://${domain} [NC]
RewriteRule \.(jpg|jpeg|png|gif)$ - [F]`;
  }else if(mode==="htmlhide"){
rule = `RewriteEngine On
RewriteCond %{REQUEST_FILENAME} !-f
RewriteRule ^([^.]+)$ $1.html [L]`;
  }
  document.getElementById('htOutput').value = rule;
}
</script>

<!-- Cookie弹窗开始 -->
<div id="cookieBox" style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:16px 24px;z-index:9999;display:none;">
    <div style="max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:16px;">
        <div style="flex:1;min-width:300px;">
            <p style="margin:0 0 6px 0;font-size:14px;color:#333;">🍪 Cookie 使用提示</p>
            <p style="margin:0;font-size:13px;color:#666;">
                本站使用Cookie优化访问体验，并投放Google联盟广告。继续使用网站即代表您同意我们的Cookie政策，您可查看<a href="/privacy.html" style="color:#0066cc;">隐私政策</a>。
            </p>
        </div>
        <div style="display:flex;gap:10px;">
            <button id="cookieAccept" style="padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;">同意</button>
            <button id="cookieReject" style="padding:8px 18px;background:#eee;color:#333;border:none;border-radius:6px;cursor:pointer;">拒绝</button>
        </div>
    </div>
</div>

<script>
const cookieBox = document.getElementById('cookieBox');
const acceptBtn = document.getElementById('cookieAccept');
const rejectBtn = document.getElementById('cookieReject');
const cookieStatus = localStorage.getItem('cookieConsent');
if (!cookieStatus) {
    cookieBox.style.display = 'block';
}
acceptBtn.onclick = function(){
    localStorage.setItem('cookieConsent','accept');
    cookieBox.style.display = 'none';
};
rejectBtn.onclick = function(){
    localStorage.setItem('cookieConsent','reject');
    cookieBox.style.display = 'none';
};
</script>
<!-- Cookie弹窗结束 -->
