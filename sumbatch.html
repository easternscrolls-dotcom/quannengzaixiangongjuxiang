<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量数字求和计算</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:220px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{padding:12px 24px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
p.result{font-size:20px;margin-top:16px;font-weight:bold}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>批量粘贴数字，自动求和（一行一个数字）</h2>
<textarea id="numArea" placeholder="每行一个数字粘贴进来"></textarea>
<button onclick="calcSum()">开始计算总和</button>
<p class="result">总和：<span id="sumOut">0</span></p>
<script>
function calcSum(){
  const txt = document.getElementById('numArea').value;
  const lines = txt.split(/\r?\n/);
  let sum = 0;
  lines.forEach(line=>{
    const n = parseFloat(line.trim());
    if(!isNaN(n)) sum += n;
  })
  document.getElementById('sumOut').innerText = sum.toFixed(4);
}
</script>
</body>
</html>
