<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON数组对象去重</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:260px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:Consolas,monospace}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>JSON数组根据指定字段去重</h2>
<textarea id="juInput" placeholder="粘贴JSON数组"></textarea>
<input id="uniqueKey" placeholder="去重依据字段名，全部对象去重则留空">
<button onclick="jsonArrayUnique()">执行去重</button>
<textarea id="juOutput" readonly></textarea>
<script>
function jsonArrayUnique(){
  try{
    const arr = JSON.parse(document.getElementById('juInput').value.trim());
    const key = document.getElementById('uniqueKey').value.trim();
    if(!Array.isArray(arr)){alert("必须是JSON数组");return;}
    const set = new Set();
    const result = [];
    for(let item of arr){
      let sign;
      if(key){
        sign = item[key];
      }else{
        sign = JSON.stringify(item);
      }
      if(!set.has(sign)){
        set.add(sign);
        result.push(item);
      }
    }
    document.getElementById('juOutput').value = JSON.stringify(result,null,2);
  }catch(e){
    document.getElementById('juOutput').value = "JSON解析错误："+e.message;
  }
}
</script>
</body>
</html>
