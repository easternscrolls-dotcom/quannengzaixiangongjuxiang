<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sitemap链接提取校验</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:260px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
textarea#checkOut{height:220px}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>粘贴Sitemap XML，批量提取所有URL链接</h2>
<textarea id="sitemapXmlInput" placeholder="粘贴sitemap.xml完整内容"></textarea>
<button onclick="parseSitemapUrl()">提取所有链接</button>
<textarea id="checkOut" readonly></textarea>
<script>
function parseSitemapUrl(){
  const xml = document.getElementById('sitemapXmlInput').value;
  const reg = /<loc>([\s\S]*?)<\/loc>/gi;
  const result = [];
  let m;
  while((m = reg.exec(xml))!==null){
    result.push(m[1].trim());
  }
  document.getElementById('checkOut').value = result.join("\n");
}
</script>
</body>
</html>
