<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let fileArr = [];
document.getElementById('batchAud').onchange = e=>{
  fileArr = Array.from(e.target.files);
  let html = "待处理文件：<br/>";
  fileArr.forEach((f,i)=>html += `${i+1}. ${f.name}<br/>`);
  fileList.innerHTML = html;
}
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function batchConvertAudio(){
  if(fileArr.length===0) return alert("选择音频文件");
  const fmt = batchFmt.value;
  await loadFFmpeg();
  const zip = new JSZip();
  for(let i=0;i<fileArr.length;i++){
    const f = fileArr[i];
    const buf = new Uint8Array(await f.arrayBuffer());
    ffmpeg.writeFile(`in${i}`, buf);
    await ffmpeg.exec(["-i",`in${i}`,"-c:a","libmp3lame",`out${i}.${fmt}`]);
    const outData = ffmpeg.readFile(`out${i}.${fmt}`);
    const saveName = f.name.replace(/\.\w+$/,`.${fmt}`);
    zip.file(saveName, outData);
  }
  const zipBuf = await zip.generateAsync({type:"uint8array"});
  const blob = new Blob([zipBuf],{type:"application/zip"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "批量转换音频.zip";
  a.click();
}
</script>
