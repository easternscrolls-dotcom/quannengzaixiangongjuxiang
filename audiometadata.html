<h2>编辑MP3元数据：歌曲名、歌手、专辑</h2>
<div class="upload-box">
<input type="file" accept=".mp3" id="audioFile">
</div>
<div class="meta-row">
<label>歌曲标题：</label>
<input id="metaTitle" placeholder="填写歌曲名称">
</div>
<div class="meta-row">
<label>歌手：</label>
<input id="metaArtist" placeholder="歌手/演唱者">
</div>
<div class="meta-row">
<label>专辑：</label>
<input id="metaAlbum" placeholder="专辑名称">
</div>
<button onclick="editAudioMeta()">保存修改导出</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let mp3File = null;
document.getElementById('audioFile').onchange = e=>mp3File = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function editAudioMeta(){
  if(!mp3File) return alert("上传mp3文件");
  const title = metaTitle.value.trim();
  const artist = metaArtist.value.trim();
  const album = metaAlbum.value.trim();
  await loadFFmpeg();
  const buf = new Uint8Array(await mp3File.arrayBuffer());
  ffmpeg.writeFile("src.mp3", buf);
  let cmd = ["-i","src.mp3"];
  if(title) cmd.push("-metadata",`title=${title}`);
  if(artist) cmd.push("-metadata",`artist=${artist}`);
  if(album) cmd.push("-metadata",`album=${album}`);
  cmd.push("-c","copy","meta_out.mp3");
  await ffmpeg.exec(cmd);
  const outBuf = ffmpeg.readFile("meta_out.mp3");
  const blob = new Blob([outBuf],{type:"audio/mpeg"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "修改信息歌曲.mp3";
  a.click();
}
</script>
