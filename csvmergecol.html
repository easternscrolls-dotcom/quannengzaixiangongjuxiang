<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV多列合并为单列</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>多列内容合并生成新列（支持连接分隔符）</h2>
<div class="upload-box">
<input type="file" accept=".csv" id="csvFile">
</div>
<input id="mergeCols" placeholder="合并列名，多个用英文逗号隔开">
<input id="joinSep" placeholder="合并之间连接符号，可留空" value="">
<input id="newColName" placeholder="新生成列名称" value="合并结果">
<button onclick="mergeMultiColumn()">合并导出CSV</button>
<script>
document.getElementById('csvFile').onchange = e=>window.csvFileObj = e.target.files[0];
async function mergeMultiColumn(){
  const colStr = document.getElementById('mergeCols').value.trim();
  const joinSep = document.getElementById('joinSep').value;
  const newName = document.getElementById('newColName').value.trim();
  if(!window.csvFileObj || !colStr || !newName) return alert("填写完整参数");
  const cols = colStr.split(",").map(s=>s.trim());
  const text = await window.csvFileObj.text();
  const res = Papa.parse(text,{header:true,skipEmptyLines:true});
  const newData = res.data.map(row=>{
    const nr = {...row};
    const arr = cols.map(c=>String(row[c]??""));
    nr[newName] = arr.join(joinSep);
    return nr;
  })
  const csvTxt = Papa.unparse({fields:res.meta.fields,data:newData});
  const blob = new Blob([csvTxt],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "多列合并表格.csv";
  a.click();
}
</script>
</body>
</html>
