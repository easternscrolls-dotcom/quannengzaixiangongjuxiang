<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV在线预览表格</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
table{width:100%;border-collapse:collapse;margin-top:15px;overflow:auto;display:block;max-height:600px}
th,td{border:1px solid #ddd;padding:8px 12px;text-align:left}
th{background:#f0f7ff}
</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>CSV 文件在线预览</h2>
<div class="upload-box">
<input type="file" accept=".csv" id="csvFile">
</div>
<table id="resultTable"></table>
<script>
document.getElementById('csvFile').onchange = async e=>{
  const file = e.target.files[0];
  Papa.parse(file, {
    header:true,
    skipEmptyLines:true,
    complete:function(res){
      renderTable(res.data,res.meta.fields)
    }
  })
}
function renderTable(data,fields){
  const tbl = document.getElementById('resultTable');
  let html = `<thead><tr>`;
  fields.forEach(f=>html += `<th>${f}</th>`);
  html += `</tr></thead><tbody>`;
  data.forEach(row=>{
    html += `<tr>`;
    fields.forEach(f=>html += `<td>${row[f]??""}</td>`)
    html += `</tr>`
  })
  html += `</tbody>`;
  tbl.innerHTML = html;
}
</script>
</body>
</html>
