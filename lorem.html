<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乱数假文生成| 全能在线工具箱</title>
<meta name="description" content="批量生成 Lorem Ipsum 或中文乱数假文，用于排版占位，免费在线工具。">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
body{padding:24px;background:#fff;} #app{max-width:900px;margin:0 auto;}
header{margin-bottom:24px;} header h1{margin-top:12px;font-size:24px;}
.tool-container{display:flex;flex-direction:column;gap:12px;}
.ops{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
label{font-size:14px;}
input,select{padding:6px;border:1px solid #ccc;border-radius:4px;}
button{padding:8px 16px;cursor:pointer;border:1px solid #ccc;background:#f5f5f5;border-radius:4px;}
button.primary{background:#2563eb;color:#fff;border-color:#2563eb;}
textarea{width:100%;min-height:200px;padding:8px;font-size:14px;border:1px solid #ccc;border-radius:4px;}
</style>
</head>
<body>
<div id="app">
  <header><a href="/">← 返回工具箱首页</a><h1>乱数假文生成</h1></header>
  <main class="tool-container">
    <div class="ops">
      <label>语言 <select id="lang"><option value="zh">中文</option><option value="en">English</option></select></label>
      <label>段落 <input id="paras" type="number" value="3" min="1" max="50" style="width:64px"></label>
      <label>每段落句数 <input id="sents" type="number" value="4" min="1" max="30" style="width:64px"></label>
      <label>每句词数 <input id="words" type="number" value="12" min="3" max="40" style="width:64px"></label>
      <button class="primary" onclick="gen()">生成</button>
      <button onclick="copy()">复制</button>
    </div>
    <textarea id="out" readonly placeholder="生成结果..."></textarea>
  </main>
<script src="/js/common.js"></script>
<script>
const toolKey = "lorem";
const zhWords = '我们 可以 这个 时候 因为 所以 如果 已经 他们 自己 一个 没有 这种 那种 问题 方法 系统 数据 用户 产品 需要 进行 通过 实现 提供 支持 分析 处理 结果 显示 包括 根据 方式 情况 对于 以及 由于 例如 目前 发展 技术 平台 服务 方案 功能 目标 标准 效率 质量 资源 环境 社会'.split(' ');
const enWords = 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum eu fugiat nulla pariatur'.split(' ');
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function gen(){
  const lang=document.getElementById('lang').value;
  const P=+document.getElementById('paras').value, S=+document.getElementById('sents').value, W=+document.getElementById('words').value;
  const words = lang==='zh'?zhWords:enWords;
  const paras=[];
  for(let p=0;p<P;p++){
    const sents=[];
    for(let s=0;s<S;s++){
      let arr=[]; for(let w=0;w<W;w++) arr.push(pick(words));
      let sent = arr.join(lang==='zh'?'':' ');
      sent = sent.charAt(0).toUpperCase()+sent.slice(1);
      sent += lang==='zh'? '。' : '.';
      sents.push(sent);
    }
    paras.push(sents.join(lang==='zh'?'':' '));
  }
  document.getElementById('out').value = paras.join('\n\n');
}
function copy(){ const v=document.getElementById('out').value; if(v) navigator.clipboard.writeText(v); }
gen();
</script>
</body>
</html>
