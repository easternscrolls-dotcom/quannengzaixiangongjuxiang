<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文案重复查重检测</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
textarea{width:100%;height:220px;padding:12px;border:1px solid #ddd;border-radius:6px;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:12px 0}
#repeatResult{padding:12px;border:1px solid #ddd;border-radius:6px;white-space:pre-wrap}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>两篇自媒体文案相似度查重简易检测</h2>
<div class="row">
<textarea id="textA" placeholder="原文A"></textarea>
<textarea id="textB" placeholder="对比文案B"></textarea>
</div>
<button onclick="calcSimilar()">计算相似度</button>
<div id="repeatResult"></div>
<script>
function calcSimilar(){
  let a = document.getElementById("textA").value.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,"");
  let b = document.getElementById("textB").value.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,"");
  const setA = new Set([...a]);
  let same = 0;
  [...b].forEach(c=>{if(setA.has(c)) same++;});
  const union = new Set([...a,...b]).size;
  const rate = union === 0 ? 0 : (same/union*100).toFixed(2);
  document.getElementById("repeatResult").innerText = `重合字符数量：${same}\n粗略相似度：${rate}%\n⚠️ 简易字符对比，仅供自媒体自查参考`;
}
</script>
</body>
</html>
