<h1 style="margin:16px 0;font-size:22px;">多音频时长汇总工具</h1>

<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>批量上传音频，统计全部总时长</h2>
<div class="upload-box">
<input type="file" accept="audio/*" multiple id="batchAud">
</div>
<button onclick="calcBatchAudioTime()">计算总时长</button>
<div id="listBox"></div>
<p class="res">总时长：<span id="totalTime">00:00:00</span></p>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let fileArr = [];
document.getElementById('batchAud').onchange = e=>fileArr = Array.from(e.target.files);
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function calcBatchAudioTime(){
  if(fileArr.length===0) return alert("选择音频文件");
  await loadFFmpeg();
  let totalSec = 0;
  let listHtml = "";
  for(let f of fileArr){
    const buf = new Uint8Array(await f.arrayBuffer());
    ffmpeg.writeFile("temp.mp3", buf);
    const probe = await ffmpeg.probe("temp.mp3");
    const dur = Number(probe.format.duration);
    totalSec += dur;
    const h = Math.floor(dur/3600);
    const m = Math.floor((dur%3600)/60);
    const s = Math.floor(dur%60);
    listHtml += `${f.name}：${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}<br/>`;
  }
  listBox.innerHTML = listHtml;
  const th = Math.floor(totalSec/3600);
  const tm = Math.floor((totalSec%3600)/60);
  const ts = Math.floor(totalSec%60);
  document.getElementById("totalTime").innerText = `${String(th).padStart(2,"0")}:${String(tm).padStart(2,"0")}:${String(ts).padStart(2,"0")}`;
}
</script>

            <button id="cookieAccept" style="padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;">同意</button>

        </div>
    </div>
</div>

<script>
const cookieBox = document.getElementById('cookieBox');
const acceptBtn = document.getElementById('cookieAccept');
const rejectBtn = document.getElementById('cookieReject');
const cookieStatus = localStorage.getItem('cookieConsent');
if (!cookieStatus) {
    cookieBox.style.display = 'block';
}
acceptBtn.onclick = function(){
    localStorage.setItem('cookieConsent','accept');
    cookieBox.style.display = 'none';
};
rejectBtn.onclick = function(){
    localStorage.setItem('cookieConsent','reject');
    cookieBox.style.display = 'none';
};
</script>
