<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量音频总时长计算器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
p.res{font-size:18px;margin-top:20px;font-weight:bold}
#listBox{margin:10px 0;line-height:1.7}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>批量上传音频，统计全部总时长</h2>
<div class="upload-box">
<input type="file" accept="audio/*" multiple id="batchAud">
</div>
<button onclick="calcBatchAudioTime()">计算总时长</button>
<div id="listBox"></div>
<p class="res">总时长：<span id="totalTime">00:00:00</span></p>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let fileArr = [];
document.getElementById('batchAud').onchange = e=>fileArr = Array.from(e.target.files);
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function calcBatchAudioTime(){
  if(fileArr.length===0) return alert("选择音频文件");
  await loadFFmpeg();
  let totalSec = 0;
  let listHtml = "";
  for(let f of fileArr){
    const buf = new Uint8Array(await f.arrayBuffer());
    ffmpeg.writeFile("temp.mp3", buf);
    const probe = await ffmpeg.probe("temp.mp3");
    const dur = Number(probe.format.duration);
    totalSec += dur;
    const h = Math.floor(dur/3600);
    const m = Math.floor((dur%3600)/60);
    const s = Math.floor(dur%60);
    listHtml += `${f.name}：${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}<br/>`;
  }
  listBox.innerHTML = listHtml;
  const th = Math.floor(totalSec/3600);
  const tm = Math.floor((totalSec%3600)/60);
  const ts = Math.floor(totalSec%60);
  document.getElementById("totalTime").innerText = `${String(th).padStart(2,"0")}:${String(tm).padStart(2,"0")}:${String(ts).padStart(2,"0")}`;
}
</script>
</body>
</html>
