<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel转CSV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>Excel(xlsx/xls) 转换 CSV 文件</h2>
<div class="upload-box">
<input type="file" accept=".xlsx,.xls" id="excelFile">
</div>
<select id="sheetSel"></select>
<button onclick="excelToCsv()">转换下载CSV</button>
<script>
let workbook = null;
document.getElementById('excelFile').onchange = async e=>{
  const file = e.target.files[0];
  const buf = await file.arrayBuffer();
  workbook = XLSX.read(buf);
  const sel = document.getElementById('sheetSel');
  sel.innerHTML = "";
  workbook.SheetNames.forEach(name=>{
    sel.innerHTML += `<option value="${name}">${name}</option>`;
  })
}
function excelToCsv(){
  if(!workbook) return alert("上传Excel文件");
  const sheetName = document.getElementById('sheetSel').value;
  const sheet = workbook.Sheets[sheetName];
  const csv = XLSX.utils.sheet_to_csv(sheet);
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = sheetName+".csv";
  a.click();
}
</script>
</body>
</html>
