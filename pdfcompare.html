<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>两份PDF文本差异对比工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.file-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px}
.upload-box{border:2px dashed #ccd6e0;padding:30px;text-align:center;border-radius:8px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 0}
textarea{width:100%;height:300px;padding:12px;border:1px solid #ddd;border-radius:6px}
span.del{background:#ffdddd;color:#c00}
span.add{background:#ddffdd;color:#090}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff@5.1.0/dist/diff.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>两份PDF文本差异对比</h2>
<div class="file-row">
<div class="upload-box">
<input type="file" accept=".pdf" id="pdfOld">
<p>原始旧PDF</p>
</div>
<div class="upload-box">
<input type="file" accept=".pdf" id="pdfNew">
<p>新版对比PDF</p>
</div>
</div>
<button onclick="comparePdfText()">对比文本差异</button>
<div id="diffResult" style="white-space:pre-line;padding:12px;border:1px solid #ddd;min-height:300px"></div>
<script>
const pdfjsLib = window.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js";
async function getPdfText(file){
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument(buf).promise;
  let full = "";
  for(let i=1;i<=doc.numPages;i++){
    const page = await doc.getPage(i);
    const textObj = await page.getTextContent();
    full += textObj.items.map(t=>t.str).join(" ")+"\n";
  }
  return full;
}
async function comparePdfText(){
  const oldFile = pdfOld.files[0];
  const newFile = pdfNew.files[0];
  if(!oldFile || !newFile) return alert("上传两份PDF文件");
  const oldTxt = await getPdfText(oldFile);
  const newTxt = await getPdfText(newFile);
  const diffArr = Diff.diffChars(oldTxt, newTxt);
  let html = "";
  diffArr.forEach(part=>{
    if(part.added) html += `<span class="add">${part.value}</span>`;
    else if(part.removed) html += `<span class="del">${part.value}</span>`;
    else html += part.value;
  })
  document.getElementById('diffResult').innerHTML = html;
}
</script>
</body>
</html>
