<body>
<h1 style="margin:16px 0;font-size:22px;">两份PDF内容对比工具</h1>

<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>两份PDF文本差异对比</h2>
<div class="file-row">
<div class="upload-box">
<input type="file" accept=".pdf" id="pdfOld">
<p>原始旧PDF</p>
</div>
<div class="upload-box">
<input type="file" accept=".pdf" id="pdfNew">
<p>新版对比PDF</p>
</div>
</div>
<button onclick="comparePdfText()">对比文本差异</button>
<div id="diffResult" style="white-space:pre-line;padding:12px;border:1px solid #ddd;min-height:300px"></div>
<script>
const pdfjsLib = window.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js";
async function getPdfText(file){
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument(buf).promise;
  let full = "";
  for(let i=1;i<=doc.numPages;i++){
    const page = await doc.getPage(i);
    const textObj = await page.getTextContent();
    full += textObj.items.map(t=>t.str).join(" ")+"\n";
  }
  return full;
}
async function comparePdfText(){
  const oldFile = pdfOld.files[0];
  const newFile = pdfNew.files[0];
  if(!oldFile || !newFile) return alert("上传两份PDF文件");
  const oldTxt = await getPdfText(oldFile);
  const newTxt = await getPdfText(newFile);
  const diffArr = Diff.diffChars(oldTxt, newTxt);
  let html = "";
  diffArr.forEach(part=>{
    if(part.added) html += `<span class="add">${part.value}</span>`;
    else if(part.removed) html += `<span class="del">${part.value}</span>`;
    else html += part.value;
  })
  document.getElementById('diffResult').innerHTML = html;
}
</script>

        <div style="display:flex;gap:10px;">
            <button id="cookieAccept" style="padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;">同意</button>
            <button id="cookieReject" style="padding:8px 18px;background:#eee;color:#333;border:none;border-radius:6px;cursor:pointer;">拒绝</button>
        </div>
    </div>
</div>

<script>
const cookieBox = document.getElementById('cookieBox');
const acceptBtn = document.getElementById('cookieAccept');
const rejectBtn = document.getElementById('cookieReject');
const cookieStatus = localStorage.getItem('cookieConsent');
if (!cookieStatus) {
    cookieBox.style.display = 'block';
}
acceptBtn.onclick = function(){
    localStorage.setItem('cookieConsent','accept');
    cookieBox.style.display = 'none';
};
rejectBtn.onclick = function(){
    localStorage.setItem('cookieConsent','reject');
    cookieBox.style.display = 'none';
};
</script>
