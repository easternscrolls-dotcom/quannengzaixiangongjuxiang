<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量图片统一格式转换</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
#fileList{margin:10px 0;line-height:1.8}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>批量图片统一转为JPG/PNG/WebP</h2>
<div class="upload-box">
<input type="file" accept="image/*" multiple id="batchImg">
</div>
<select id="targetFmt">
<option value="jpg">转为 JPG</option>
<option value="png">转为 PNG</option>
<option value="webp">转为 WebP</option>
</select>
<div id="fileList"></div>
<button onclick="batchConvertImg()">批量转换打包下载</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let fileArr = [];
document.getElementById('batchImg').onchange = e=>{
  fileArr = Array.from(e.target.files);
  let html = "待转换图片：<br/>";
  fileArr.forEach((f,i)=>html += `${i+1}. ${f.name}<br/>`);
  fileList.innerHTML = html;
}
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function batchConvertImg(){
  if(fileArr.length === 0) return alert("选择图片");
  const fmt = targetFmt.value;
  await loadFFmpeg();
  const zip = new JSZip();
  for(let i=0;i<fileArr.length;i++){
    const f = fileArr[i];
    const buf = new Uint8Array(await f.arrayBuffer());
    ffmpeg.writeFile(`in${i}`, buf);
    await ffmpeg.exec(["-i",`in${i}`,`out${i}.${fmt}`]);
    const data = ffmpeg.readFile(`out${i}.${fmt}`);
    const saveName = f.name.replace(/\.\w+$/,"."+fmt);
    zip.file(saveName, data);
  }
  const zipBuf = await zip.generateAsync({type:"uint8array"});
  const blob = new Blob([zipBuf],{type:"application/zip"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "批量转换图片包.zip";
  a.click();
}
</script>
</body>
</html>
