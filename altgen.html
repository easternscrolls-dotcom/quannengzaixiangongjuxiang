<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片ALT标签批量生成</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:200px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>批量生成 img alt 属性代码（图片SEO）</h2>
<textarea id="altInput" placeholder="每行：图片地址|图片描述"></textarea>
<button onclick="buildAltTag()">生成IMG代码</button>
<textarea id="altOutput" readonly></textarea>
<script>
function buildAltTag(){
  const lines = document.getElementById('altInput').value.split(/\r?\n/).filter(s=>s.trim());
  let html = "";
  lines.forEach(line=>{
    const arr = line.split("|");
    if(arr.length>=2){
      const src = arr[0].trim();
      const alt = arr[1].trim();
      html += `<img src="${src}" alt="${alt}">\n`;
    }
  })
  document.getElementById('altOutput').value = html;
}
</script>
</body>
</html>
