<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贷款计算器 等额本息 等额本金</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 0}
#resultOut{padding:12px;border:1px solid #ddd;border-radius:6px;white-space:pre-line}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>房贷贷款计算器｜等额本息 / 等额本金</h2>
<input id="loanMoney" placeholder="贷款总金额（元）" type="number" step="0.01">
<input id="loanYear" placeholder="贷款年限">
<input id="loanRate" placeholder="年利率（如3.45）">
<select id="loanType">
<option value="bx">等额本息</option>
<option value="bj">等额本金</option>
</select>
<button onclick="calcLoan()">计算</button>
<div id="resultOut"></div>
<script>
function calcLoan(){
    const money = parseFloat(document.getElementById('loanMoney').value);
    const year = parseFloat(document.getElementById('loanYear').value);
    const rateYear = parseFloat(document.getElementById('loanRate').value);
    const type = document.getElementById('loanType').value;
    if(isNaN(money)||isNaN(year)||isNaN(rateYear)){alert("请填写完整数字");return;}
    const month = year * 12;
    const monthRate = rateYear / 100 / 12;
    let txt = "";
    if(type === "bx"){
        //等额本息
        let monthPay = money * monthRate * Math.pow(1+monthRate,month) / (Math.pow(1+monthRate,month)-1);
        let total = monthPay * month;
        let interest = total - money;
        txt = `每月固定还款：${monthPay.toFixed(2)} 元
还款总月数：${month} 期
还款总额：${total.toFixed(2)} 元
总利息：${interest.toFixed(2)} 元`;
    }else{
        //等额本金
        let base = money / month;
        let firstPay = base + money * monthRate;
        let lastPay = base + base * monthRate;
        let totalInterest = (month+1)*money*monthRate/2;
        let total = money + totalInterest;
        txt = `每月归还本金：${base.toFixed(2)} 元
首月还款：${firstPay.toFixed(2)} 元
末月还款：${lastPay.toFixed(2)} 元
还款总额：${total.toFixed(2)} 元
总利息：${totalInterest.toFixed(2)} 元`;
    }
    document.getElementById('resultOut').innerText = txt;
}
</script>
</body>
</html>
