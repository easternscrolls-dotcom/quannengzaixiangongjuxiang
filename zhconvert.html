<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简体繁体互转工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:220px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/opencc.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>简体中文 ↔ 繁体中文转换</h2>
<textarea id="zhInput" placeholder="粘贴中文文本"></textarea>
<div class="btn-row">
<button onclick="toTrad()">简体→繁体</button>
<button onclick="toSimp()">繁体→简体</button>
</div>
<textarea id="zhOutput" readonly></textarea>
<script>
const {Converter} = opencc;
async function toTrad(){
  const cc = new Converter('cn','t');
  document.getElementById('zhOutput').value = await cc.convert(document.getElementById('zhInput').value);
}
async function toSimp(){
  const cc = new Converter('t','cn');
  document.getElementById('zhOutput').value = await cc.convert(document.getElementById('zhInput').value);
}
</script>
</body>
</html>
