<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV清理空行、首尾空白字符</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>CSV清理：删除空行、单元格首尾空格</h2>
<div class="upload-box">
<input type="file" accept=".csv" id="csvFile">
</div>
<button onclick="cleanCsv()">清理并下载</button>
<script>
document.getElementById('csvFile').onchange = e=>window.csvFileObj = e.target.files[0];
async function cleanCsv(){
  if(!window.csvFileObj) return alert("请上传CSV文件");
  const text = await window.csvFileObj.text();
  const res = Papa.parse(text,{header:true,skipEmptyLines:true});
  const cleanData = res.data.map(row=>{
    const newRow = {};
    for(let key in row){
      newRow[key] = String(row[key]).trim();
    }
    return newRow;
  });
  const csvTxt = Papa.unparse({fields:res.meta.fields,data:cleanData});
  const blob = new Blob([csvTxt],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "清理后表格.csv";
  a.click();
}
</script>
</body>
</html>
