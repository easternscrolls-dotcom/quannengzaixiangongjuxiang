<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高强度随机密码生成器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<input id="pwdLen" placeholder="密码长度" type="number" value="16">
<input id="pwdCount" placeholder="生成数量" type="number" value="5">
</div>
<div style="margin:10px 0">
<label><input type="checkbox" id="useUpper" checked>大写字母</label>
<label><input type="checkbox" id="useLower" checked>小写字母</label>
<label><input type="checkbox" id="useNum" checked>数字</label>
<label><input type="checkbox" id="useSym" checked>特殊符号</label>
</div>
<button onclick="genPwd()" style="width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 0">生成密码</button>
<textarea id="pwdOut" readonly style="width:100%;height:200px;padding:12px;border:1px solid #ddd;border-radius:6px;font-family:monospace"></textarea>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>高强度随机密码批量生成</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<input id="pwdLen" placeholder="密码长度" type="number" value="16">
<input id="pwdCount" placeholder="生成数量" type="number" value="5">
</div>
<div style="margin:10px 0">
<label><input type="checkbox" id="useUpper" checked>大写字母</label>
<label><input type="checkbox" id="useLower" checked>小写字母</label>
<label><input type="checkbox" id="useNum" checked>数字</label>
<label><input type="checkbox" id="useSym" checked>特殊符号</label>
</div>
<button onclick="genPwd()">生成密码</button>
<textarea id="pwdOut" readonly></textarea>
<script>
function genPwd(){
    const len = parseInt(document.getElementById('pwdLen').value);
    const count = parseInt(document.getElementById('pwdCount').value);
    const useUpper = document.getElementById('useUpper').checked;
    const useLower = document.getElementById('useLower').checked;
    const useNum = document.getElementById('useNum').checked;
    const useSym = document.getElementById('useSym').checked;
    let pool = "";
    if(useUpper) pool += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    if(useLower) pool += "abcdefghijklmnopqrstuvwxyz";
    if(useNum) pool += "0123456789";
    if(useSym) pool += "!@#$%^&*()_+-=";
    if(pool.length === 0){alert("至少选择一类字符");return;}
    const res = [];
    for(let k=0;k<count;k++){
        let s = "";
        for(let i=0;i<len;i++){
            s += pool[Math.floor(Math.random()*pool.length)];
        }
        res.push(s);
    }
    document.getElementById('pwdOut').value = res.join("\n");
}
</script>
</body>
</html>
