<h2>多个音频按上传顺序合并为单个MP3</h2>

<input type="file" accept="audio/*" multiple id="audioInput">
<p style="margin-top:8px;color:#666">多选音频，顺序为播放顺序</p>

<button onclick="mergeAudio()">合并音频导出</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let fileArr = [];
document.getElementById('audioInput').onchange = e=>{
  fileArr = Array.from(e.target.files);
  let html = "已选择音频：<br/>";
  fileArr.forEach((f,i)=>html += `${i+1}. ${f.name}<br/>`);
  fileList.innerHTML = html;
}
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function mergeAudio(){
  if(fileArr.length<2) return alert("至少选择2个音频");
  await loadFFmpeg();
  let txt = "";
  for(let i=0;i<fileArr.length;i++){
    const buf = new Uint8Array(await fileArr[i].arrayBuffer());
    ffmpeg.writeFile(`aud${i}.mp3`, buf);
    txt += `file 'aud${i}.mp3'\n`;
  }
  ffmpeg.writeFile("list.txt", new TextEncoder().encode(txt));
  await ffmpeg.exec(["-f","concat","-safe","0","-i","list.txt","-c","copy","merge_out.mp3"]);
  const outBuf = ffmpeg.readFile("merge_out.mp3");
  const blob = new Blob([outBuf],{type:"audio/mpeg"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "合并音频.mp3";
  a.click();
}
</script>
