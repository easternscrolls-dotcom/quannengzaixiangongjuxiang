<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清除图片EXIF隐私信息工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>一键清除照片EXIF（拍摄时间、定位、相机型号）</h2>
<div class="upload-box">
<input type="file" accept="image/*" id="imgFile">
</div>
<button onclick="stripExif()">清除EXIF导出图片</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let imgBlob = null;
document.getElementById('imgFile').onchange = e=>imgBlob = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function stripExif(){
  if(!imgBlob) return alert("上传图片");
  await loadFFmpeg();
  const buf = new Uint8Array(await imgBlob.arrayBuffer());
  ffmpeg.writeFile("src.jpg", buf);
  await ffmpeg.exec(["-i","src.jpg","-map_metadata","-1","-c:v","copy","no_exif.jpg"]);
  const outBuf = ffmpeg.readFile("no_exif.jpg");
  const blob = new Blob([outBuf],{type:"image/jpeg"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "无EXIF照片.jpg";
  a.click();
}
</script>
</body>
</html>
