<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全屏平铺重复水印工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.box{border:2px dashed #ccd6e0;padding:40px;text-align:center;margin:12px 0;border-radius:8px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>图片铺满全屏重复文字水印（防盗图）</h2>
<div class="box">
<input type="file" accept="image/*" id="baseImg">
<p>底图</p>
</div>
<input id="repeatText" placeholder="水印文字" value="版权所有禁止盗用">
<button onclick="repeatWatermark()">生成平铺水印图</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let baseImg = null;
document.getElementById('baseImg').onchange = e=>baseImg = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function repeatWatermark(){
  if(!baseImg || !repeatText.value.trim()) return alert("上传图片并填写水印文字");
  const text = repeatText.value.trim();
  await loadFFmpeg();
  const buf = new Uint8Array(await baseImg.arrayBuffer());
  ffmpeg.writeFile("src.png", buf);
  const filter = `drawtext=text='${text}':x=0:y=0:fontsize=24:fontcolor=white@0.2:tile=1`;
  await ffmpeg.exec(["-i","src.png","-vf",filter,"repeat_water.png"]);
  const outBuf = ffmpeg.readFile("repeat_water.png");
  const blob = new Blob([outBuf],{type:"image/png"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "平铺防盗水印图片.png";
  a.click();
}
</script>
</body>
</html>
