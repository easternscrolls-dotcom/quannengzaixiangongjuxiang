<meta name="description" content="JSON格式化、压缩、校验，免费在线工具，浏览器本地处理，保护隐私。">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
body{padding:24px;background:#fff;}
#app{max-width:900px;margin:0 auto;}
header{margin-bottom:24px;}
header h1{margin-top:12px;font-size:24px;}
.tool-container{display:flex;flex-direction:column;gap:12px;}
textarea{width:100%;min-height:160px;padding:8px;font-size:14px;border:1px solid #ccc;border-radius:4px;font-family:ui-monospace,Menlo,Consolas,monospace;}
.ops{display:flex;flex-wrap:wrap;gap:8px;}
button{padding:8px 16px;cursor:pointer;border:1px solid #ccc;background:#f5f5f5;border-radius:4px;}
button.primary{background:#2563eb;color:#fff;border-color:#2563eb;}
#status{font-size:14px;color:#666;}
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="/">← 返回工具箱首页</a>
    <h1>JSON格式化校验</h1>
  </header>
  <main class="tool-container">
    <textarea id="input" placeholder="在此粘贴 JSON 文本..."></textarea>
    <div class="ops">
      <button class="primary" onclick="fmt()">格式化</button>
      <button onclick="minify()">压缩</button>
      <button onclick="validate()">校验</button>
      <button onclick="copyOut()">复制结果</button>
      <button onclick="downloadOut()">下载</button>
    </div>
    <div id="status">本地处理，数据不会上传。</div>
    <textarea id="output" readonly placeholder="结果输出..."></textarea>
  </main>
<script src="/js/common.js"></script>
<script>
const toolKey = "json";
const input = document.getElementById('input');
const output = document.getElementById('output');
const status = document.getElementById('status');
function fmt(){
  try{
    const o = JSON.parse(input.value);
    output.value = JSON.stringify(o, null, 2);
    status.textContent = '✅ 有效 JSON，已美化（' + (Array.isArray(o)?o.length+' 项':'对象') + '）';
  }catch(e){ status.textContent = '❌ 解析失败：' + e.message; }
}
function minify(){
  try{
    const o = JSON.parse(input.value);
    output.value = JSON.stringify(o);
    status.textContent = '✅ 已压缩';
  }catch(e){ status.textContent = '❌ 解析失败：' + e.message; }
}
function validate(){
  if(!input.value.trim()){ status.textContent = '⚠️ 请先输入 JSON'; return; }
  try{ JSON.parse(input.value); status.textContent = '✅ JSON 合法'; }
  catch(e){ status.textContent = '❌ 不合法：' + e.message; }
}
function copyOut(){
  if(!output.value){ return; }
  navigator.clipboard.writeText(output.value).then(()=>status.textContent='✅ 已复制');
}
function downloadOut(){
  if(!output.value){ return; }
  const b = new Blob([output.value], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'data.json'; a.click();
  URL.revokeObjectURL(a.href);
}
</script>

<!-- Cookie弹窗开始 -->
<div id="cookieBox" style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:16px 24px;z-index:9999;display:none;">
    <div style="max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:16px;">
        <div style="flex:1;min-width:300px;">
            <p style="margin:0 0 6px 0;font-size:14px;color:#333;">🍪 Cookie 使用提示</p>
            <p style="margin:0;font-size:13px;color:#666;">
                本站使用Cookie优化访问体验，并投放Google联盟广告。继续使用网站即代表您同意我们的Cookie政策，您可查看<a href="/privacy.html" style="color:#0066cc;">隐私政策</a>。
            </p>
        </div>
        <div style="display:flex;gap:10px;">
            <button id="cookieAccept" style="padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;">同意</button>
            <button id="cookieReject" style="padding:8px 18px;background:#eee;color:#333;border:none;border-radius:6px;cursor:pointer;">拒绝</button>
        </div>
    </div>
</div>

<script>
const cookieBox = document.getElementById('cookieBox');
const acceptBtn = document.getElementById('cookieAccept');
const rejectBtn = document.getElementById('cookieReject');
const cookieStatus = localStorage.getItem('cookieConsent');
if (!cookieStatus) {
    cookieBox.style.display = 'block';
}
acceptBtn.onclick = function(){
    localStorage.setItem('cookieConsent','accept');
    cookieBox.style.display = 'none';
};
rejectBtn.onclick = function(){
    localStorage.setItem('cookieConsent','reject');
    cookieBox.style.display = 'none';
};
</script>
