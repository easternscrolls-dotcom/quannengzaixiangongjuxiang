<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hash加密 MD5 SHA1 SHA256 SHA512</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:160px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:12px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
</style>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>文本Hash摘要 MD5 / SHA1 / SHA256 / SHA512</h2>
<textarea id="hashInput" placeholder="待加密文本"></textarea>
<select id="hashType">
<option value="MD5">MD5</option>
<option value="SHA1">SHA1</option>
<option value="SHA256">SHA256</option>
<option value="SHA512">SHA512</option>
</select>
<button onclick="calcHash()">计算Hash</button>
<input id="hashOutput" readonly>
<script>
function calcHash(){
  const txt = document.getElementById('hashInput').value;
  const type = document.getElementById('hashType').value;
  let res;
  switch(type){
    case "MD5": res = CryptoJS.MD5(txt); break;
    case "SHA1": res = CryptoJS.SHA1(txt); break;
    case "SHA256": res = CryptoJS.SHA256(txt); break;
    case "SHA512": res = CryptoJS.SHA512(txt); break;
  }
  document.getElementById('hashOutput').value = res.toString();
}
</script>
</body>
</html>
