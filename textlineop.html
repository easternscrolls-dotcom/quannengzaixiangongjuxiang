<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本行处理工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:240px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
.btn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
button{padding:11px;background:#2478f5;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>多行文本操作：去重、逆序、清除空行</h2>
<textarea id="lineInput"></textarea>
<div class="btn-grid">
<button onclick="lineDistinct()">行去重（保留首次）</button>
<button onclick="lineReverse()">行顺序逆序翻转</button>
<button onclick="lineClearEmpty()">删除所有空行</button>
</div>
<textarea id="lineOutput" readonly></textarea>
<script>
function getLines(){
  return document.getElementById('lineInput').value.split(/\r?\n/);
}
function setResult(lines){
  document.getElementById('lineOutput').value = lines.join("\n");
}
function lineDistinct(){
  const set = new Set();
  const res = [];
  getLines().forEach(line=>{
    if(!set.has(line)){
      set.add(line);
      res.push(line);
    }
  })
  setResult(res);
}
function lineReverse(){
  setResult(getLines().reverse());
}
function lineClearEmpty(){
  setResult(getLines().filter(s=>s.trim()!==''));
}
</script>
</body>
</html>
