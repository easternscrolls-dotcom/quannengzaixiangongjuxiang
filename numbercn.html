<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字转中文读法</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
<input id="cnOut" readonly style="margin-top:10px">
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>阿拉伯数字转为中文读法</h2>
<input id="numInput" placeholder="输入数字，支持整数">
<button onclick="numToCn()">转换中文读法</button>
<input id="cnOut" readonly>
<script>
function numToCn(){
    const str = document.getElementById('numInput').value.trim();
    if(!/^\d+$/.test(str)){alert("仅支持正整数");return;}
    const digit = ['零','一','二','三','四','五','六','七','八','九'];
    const unit = ['','十','百','千','万','十','百','千','亿'];
    let res = "";
    let zeroFlag = false;
    for(let i=0;i<str.length;i++){
        const d = parseInt(str[i]);
        const pos = str.length - 1 - i;
        if(d === 0){
            zeroFlag = true;
        }else{
            if(zeroFlag) res += "零";
            res += digit[d] + unit[pos];
            zeroFlag = false;
        }
    }
    if(res === "") res = "零";
    document.getElementById('cnOut').value = res;
}
</script>
</body>
</html>
