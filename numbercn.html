<h2>阿拉伯数字转为中文读法</h2>
<input id="numInput" placeholder="输入数字，支持整数">
<button onclick="numToCn()">转换中文读法</button>
<input id="cnOut" readonly>
<script>
function numToCn(){
    const str = document.getElementById('numInput').value.trim();
    if(!/^\d+$/.test(str)){alert("仅支持正整数");return;}
    const digit = ['零','一','二','三','四','五','六','七','八','九'];
    const unit = ['','十','百','千','万','十','百','千','亿'];
    let res = "";
    let zeroFlag = false;
    for(let i=0;i<str.length;i++){
        const d = parseInt(str[i]);
        const pos = str.length - 1 - i;
        if(d === 0){
            zeroFlag = true;
        }else{
            if(zeroFlag) res += "零";
            res += digit[d] + unit[pos];
            zeroFlag = false;
        }
    }
    if(res === "") res = "零";
    document.getElementById('cnOut').value = res;
}
</script>
