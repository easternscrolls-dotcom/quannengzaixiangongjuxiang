<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV列数值统计</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
textarea{width:100%;height:200px;margin-top:15px;padding:12px;border:1px solid #ddd;border-radius:6px}
</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>数值列统计：总和、均值、最大、最小</h2>
<div class="upload-box">
<input type="file" accept=".csv" id="csvFile">
</div>
<input id="statCol" placeholder="待统计数字列名称">
<button onclick="csvColumnStat()">开始统计</button>
<textarea id="statResult" readonly></textarea>
<script>
document.getElementById('csvFile').onchange = e=>window.csvFileObj = e.target.files[0];
async function csvColumnStat(){
  const col = document.getElementById('statCol').value.trim();
  if(!window.csvFileObj || !col) return alert("上传文件并填写列名");
  const text = await window.csvFileObj.text();
  const res = Papa.parse(text,{header:true,skipEmptyLines:true});
  const nums = [];
  res.data.forEach(row=>{
    const v = parseFloat(row[col]);
    if(!isNaN(v)) nums.push(v);
  })
  if(nums.length===0){
    document.getElementById('statResult').value = "该列无有效数字";
    return;
  }
  const sum = nums.reduce((a,b)=>a+b,0);
  const avg = sum / nums.length;
  const max = Math.max(...nums);
  const min = Math.min(...nums);
  let out = `有效数据行数：${nums.length}\n`;
  out += `总和：${sum.toFixed(4)}\n`;
  out += `平均值：${avg.toFixed(4)}\n`;
  out += `最大值：${max.toFixed(4)}\n`;
  out += `最小值：${min.toFixed(4)}`;
  document.getElementById('statResult').value = out;
}
</script>
</body>
</html>
