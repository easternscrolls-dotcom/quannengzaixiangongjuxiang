<h2>Word DOCX转PDF</h2>

<input type="file" accept=".docx" id="docFile">
<p style="margin-top:10px;color:#666">仅支持docx格式文档</p>
</div>
<button onclick="wordToPdf()">转换生成PDF</button>
<script>
const { jsPDF } = window.jspdf;
async function wordToPdf(){
  const file = document.getElementById('docFile').files[0];
  if(!file) return alert("请上传docx文档");
  const arrayBuf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({arrayBuffer:arrayBuf});
  const text = result.value;
  const doc = new jsPDF('p','mm','a4');
  doc.setFont("simhei");
  doc.text(text,12,15,{maxWidth:185});
  doc.save("word转pdf文档.pdf");
}
</script>
