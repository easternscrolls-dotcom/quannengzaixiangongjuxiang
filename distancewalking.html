<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步数距离换算计算器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 0}
#resultOut{padding:12px;border:1px solid #ddd;border-radius:6px;white-space:pre-line}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>步数 ↔ 步行距离换算（默认步幅0.7米）</h2>
<input id="stepVal" placeholder="步数 / 距离(km)" type="number" step="0.01">
<select id="stepMode">
<option value="step">步数 → 公里</option>
<option value="km">公里 → 步数</option>
</select>
<input id="stepLength" placeholder="步幅（米）默认0.7" value="0.7">
<button onclick="calcStep()">换算</button>
<div id="resultOut"></div>
<script>
function calcStep(){
    const val = parseFloat(document.getElementById('stepVal').value);
    const mode = document.getElementById('stepMode').value;
    const sl = parseFloat(document.getElementById('stepLength').value);
    if(isNaN(val)||isNaN(sl)||sl<=0){alert("参数错误");return;}
    let txt;
    if(mode === "step"){
        const km = val * sl / 1000;
        txt = `${val} 步 ≈ ${km.toFixed(2)} 公里`;
    }else{
        const step = val * 1000 / sl;
        txt = `${val} 公里 ≈ ${Math.round(step)} 步`;
    }
    document.getElementById('resultOut').innerText = txt;
}
</script>
</body>
</html>
