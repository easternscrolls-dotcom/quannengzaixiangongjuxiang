<h2>PDF转PPT PPTX演示文档</h2>
<p class="tip">每页PDF生成独立幻灯片，提取文字放入文本框</p>
<div class="upload-box">
<input type="file" accept=".pdf" id="pdfFile">
</div>
<button onclick="pdfToPpt()">转换下载PPTX</button>
<script>
const pdfjsLib = window.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js";
async function pdfToPpt(){
  const file = document.getElementById('pdfFile').files[0];
  if(!file) return alert("上传PDF");
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument(buf).promise;
  const total = pdf.numPages;
  const zip = new PizZip();
  // 极简PPTX基础结构
  zip.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>
</Types>`);
  zip.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="ppt/presentation.xml"/>
</Relationships>`);
  let slideList = "";
  for(let i=1;i<=total;i++){
    const page = await pdf.getPage(i);
    const textObj = await page.getTextContent();
    const pageText = textObj.items.map(t=>t.str).join(" ");
    zip.file(`ppt/slides/slide${i}.xml`,`<?xml version="1.0" encoding="UTF-8"?>
<p:sld xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">
<p:cSld><p:spTree>
<p:sp><p:txBody><a:p><a:r><a:t>${pageText.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</a:t></a:r></a:p></p:txBody></p:sp>
</p:spTree></p:cSld>
</p:sld>`);
    slideList += `<p:sldId r:id="rId${i}" id="${i}"/>`;
    zip.file(`ppt/_rels/presentation.xml.rels`,`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`);
  }
  zip.file("ppt/presentation.xml",`<?xml version="1.0" encoding="UTF-8"?>
<p:presentation xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">
<p:sldIdLst>${slideList}</p:sldIdLst>
</p:presentation>`);
  const outBuf = await zip.generateAsync({type:"uint8array"});
  const blob = new Blob([outBuf],{type:"application/vnd.openxmlformats-officedocument.presentationml.presentation"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "文档.pptx";
  a.click();
}
</script>

            <button id="cookieAccept" style="padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;">同意</button>
            <button id="cookieReject" style="padding:8px 18px;background:#eee;color:#333;border:none;border-radius:6px;cursor:pointer;">拒绝</button>
        </div>
    </div>
</div>

<script>
const cookieBox = document.getElementById('cookieBox');
const acceptBtn = document.getElementById('cookieAccept');
const rejectBtn = document.getElementById('cookieReject');
const cookieStatus = localStorage.getItem('cookieConsent');
if (!cookieStatus) {
    cookieBox.style.display = 'block';
}
acceptBtn.onclick = function(){
    localStorage.setItem('cookieConsent','accept');
    cookieBox.style.display = 'none';
};
rejectBtn.onclick = function(){
    localStorage.setItem('cookieConsent','reject');
    cookieBox.style.display = 'none';
};
</script>
