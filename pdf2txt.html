<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF导出纯TXT文本文件</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
button{padding:12px 24px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 0}
textarea{width:100%;height:300px;border:1px solid #ddd;border-radius:6px;padding:12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>PDF导出纯TXT文本</h2>
<div class="upload-box">
<input type="file" accept=".pdf" id="pdfFile">
</div>
<button onclick="pdfToTxt()">提取并下载TXT</button>
<textarea id="txtOut" readonly></textarea>
<script>
const pdfjsLib = window.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js";
let fullText = "";
document.getElementById('pdfFile').onchange = async e=>{
  const f = e.target.files[0];
  const buf = await f.arrayBuffer();
  const pdf = await pdfjsLib.getDocument(buf).promise;
  fullText = "";
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const textObj = await page.getTextContent();
    fullText += `=====第${i}页=====\n${textObj.items.map(t=>t.str).join(" ")}\n\n`;
  }
  document.getElementById('txtOut').value = fullText;
}
function pdfToTxt(){
  if(!fullText) return alert("先上传PDF文件");
  const blob = new Blob([fullText],{type:"text/plain;charset=utf-8"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "文档文本.txt";
  a.click();
}
</script>
</body>
</html>
