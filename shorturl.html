<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地短链接生成（前端算法，无需接口）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
textarea{width:100%;height:140px;padding:12px;border:1px solid #ddd;border-radius:6px;margin-top:10px;font-family:monospace}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>本地算法短链接生成（仅编码，无云端存储）</h2>
<input id="longUrl" placeholder="粘贴原始长链接">
<input id="baseDomain" placeholder="你的短域名，例如 https://t.xxx.com" value="">
<button onclick="createShortUrl()">生成短链接</button>
<textarea id="shortResult" readonly></textarea>
<script>
function base62Encode(num){
  const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
  let s = "";
  if(num===0) return chars[0];
  while(num>0){
    s = chars[num%62] + s;
    num = Math.floor(num/62);
  }
  return s;
}
function createShortUrl(){
  const long = document.getElementById('longUrl').value.trim();
  const domain = document.getElementById('baseDomain').value.trim();
  const hashNum = [...long].reduce((acc,char)=>acc*31 + char.charCodeAt(0),17);
  const code = base62Encode(Math.abs(hashNum));
  let shortLink;
  if(domain){
    shortLink = domain + "/" + code;
  }else{
    shortLink = "短码："+code;
  }
  document.getElementById('shortResult').value = shortLink;
}
</script>
</body>
</html>
