<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF动图尺寸缩放工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>自定义缩放GIF动图宽度</h2>
<div class="upload-box">
<input type="file" accept=".gif" id="gifFile">
</div>
<input id="gifWidth" placeholder="目标宽度，如360" value="400">
<button onclick="resizeGif()">修改尺寸导出</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let gifFile = null;
document.getElementById('gifFile').onchange = e=>gifFile = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function resizeGif(){
  if(!gifFile) return alert("上传GIF");
  const w = gifWidth.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await gifFile.arrayBuffer());
  ffmpeg.writeFile("src.gif", buf);
  await ffmpeg.exec(["-i","src.gif","-vf",`scale=${w}:-1`,"resize.gif"]);
  const outBuf = ffmpeg.readFile("resize.gif");
  const blob = new Blob([outBuf],{type:"image/gif"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "缩放后动图.gif";
  a.click();
}
</script>
</body>
</html>
