<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字字数字符统计 | 72在线工具箱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:280px;padding:12px;border:1px solid #ddd;border-radius:6px;font-family:monospace}
.stat-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.stat-item{padding:12px;background:#f3f7ff;border-radius:8px;text-align:center;font-size:15px}
.stat-item b{font-size:20px;color:#1d4ed8}
</style>
</head>
<body>
<h1 style="margin:16px 0;font-size:22px;">文字字数字符统计</h1>

<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>实时统计：字符数、字数、行数、中英文</h2>
<textarea id="countInput" oninput="calcTextCount()"></textarea>
<div class="stat-info">
<div class="stat-item">总字符(含空格)<br><b id="allChar">0</b></div>
<div class="stat-item">纯字符(不含空格)<br><b id="noSpaceChar">0</b></div>
<div class="stat-item">有效行数<br><b id="lineCount">0</b></div>
<div class="stat-item">中文汉字<br><b id="cnCount">0</b></div>
<div class="stat-item">英文字母<br><b id="enCount">0</b></div>
<div class="stat-item">数字<br><b id="numCount">0</b></div>
</div>
<script>
function calcTextCount(){
  const txt = document.getElementById('countInput').value;
  document.getElementById('allChar').innerText = txt.length;
  const txtNoSpace = txt.replace(/\s/g,"");
  document.getElementById('noSpaceChar').innerText = txtNoSpace.length;
  const lines = txt.split(/\r?\n/).filter(s=>s.trim()!=='');
  document.getElementById('lineCount').innerText = lines.length;
  const cn = (txt.match(/[\u4e00-\u9fa5]/g)||[]).length;
  const en = (txt.match(/[a-zA-Z]/g)||[]).length;
  const num = (txt.match(/[0-9]/g)||[]).length;
  document.getElementById('cnCount').innerText = cn;
  document.getElementById('enCount').innerText = en;
  document.getElementById('numCount').innerText = num;
}
</script>

<!-- Cookie弹窗开始 -->
<div id="cookieBox" style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:16px 24px;z-index:9999;display:none;">
    <div style="max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:16px;">
        <div style="flex:1;min-width:300px;">
            <p style="margin:0 0 6px 0;font-size:14px;color:#333;">🍪 Cookie 使用提示</p>
            <p style="margin:0;font-size:13px;color:#666;">
                本站使用Cookie优化访问体验，并投放Google联盟广告。继续使用网站即代表您同意我们的Cookie政策，您可查看<a href="/privacy.html" style="color:#0066cc;">隐私政策</a>。
            </p>
        </div>
        <div style="display:flex;gap:10px;">
            <button id="cookieAccept" style="padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;">同意</button>
            <button id="cookieReject" style="padding:8px 18px;background:#eee;color:#333;border:none;border-radius:6px;cursor:pointer;">拒绝</button>
        </div>
    </div>
</div>

<script>
const cookieBox = document.getElementById('cookieBox');
const acceptBtn = document.getElementById('cookieAccept');
const rejectBtn = document.getElementById('cookieReject');
const cookieStatus = localStorage.getItem('cookieConsent');
if (!cookieStatus) {
    cookieBox.style.display = 'block';
}
acceptBtn.onclick = function(){
    localStorage.setItem('cookieConsent','accept');
    cookieBox.style.display = 'none';
};
rejectBtn.onclick = function(){
    localStorage.setItem('cookieConsent','reject');
    cookieBox.style.display = 'none';
};
</script>
<!-- Cookie弹窗结束 -->

</html>
