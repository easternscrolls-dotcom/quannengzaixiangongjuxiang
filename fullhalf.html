<body>
<h1 style="margin:16px 0;font-size:22px;">全角半角字符转换</h1>

<div id="app">
  <header><a href="/">← 返回工具箱首页</a><h1>全角半角转换</h1></header>
  <main class="tool-container">
    <textarea id="in" placeholder="输入文本..."></textarea>
    <div class="ops">
      <button onclick="conv('toFull')">半角 → 全角</button>
      <button onclick="conv('toHalf')">全角 → 半角</button>
      <button onclick="copy()">复制结果</button>
    </div>
    <textarea id="out" readonly placeholder="结果..."></textarea>
  </main>
<script src="/js/common.js"></script>
<script>
const toolKey = "fullhalf";
const inp=document.getElementById('in'), out=document.getElementById('out');
function conv(mode){
  const t=inp.value; let r='';
  for(const ch of t){
    const c=ch.codePointAt(0);
    if(mode==='toFull'){
      if(c===0x20) r+='　';
      else if(c>=0x21&&c<=0x7E) r+=String.fromCodePoint(c+0xFEE0);
      else r+=ch;
    } else {
      if(c===0x3000) r+=' ';
      else if(c>=0xFF01&&c<=0xFF5E) r+=String.fromCodePoint(c-0xFEE0);
      else r+=ch;
    }
  }
  out.value=r;
}
function copy(){ if(out.value) navigator.clipboard.writeText(out.value); }
</script>

</div>

<script>
const cookieBox = document.getElementById('cookieBox');
const acceptBtn = document.getElementById('cookieAccept');
const rejectBtn = document.getElementById('cookieReject');
const cookieStatus = localStorage.getItem('cookieConsent');
if (!cookieStatus) {
    cookieBox.style.display = 'block';
}
acceptBtn.onclick = function(){
    localStorage.setItem('cookieConsent','accept');
    cookieBox.style.display = 'none';
};
rejectBtn.onclick = function(){
    localStorage.setItem('cookieConsent','reject');
    cookieBox.style.display = 'none';
};
</script>
