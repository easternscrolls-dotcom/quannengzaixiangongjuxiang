<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV按固定行数拆分多个文件</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>按固定行数拆分CSV，保留表头</h2>
<div class="upload-box">
<input type="file" accept=".csv" id="csvFile">
</div>
<input id="limitRow" placeholder="每个文件最大行数（不含表头）" value="500">
<button onclick="splitFixedRows()">拆分打包下载</button>
<script>
document.getElementById('csvFile').onchange = e=>window.csvFileObj = e.target.files[0];
async function splitFixedRows(){
  const limit = parseInt(document.getElementById('limitRow').value);
  if(!window.csvFileObj || isNaN(limit)) return alert("填写有效行数");
  const text = await window.csvFileObj.text();
  const res = Papa.parse(text,{header:true,skipEmptyLines:true});
  const fields = res.meta.fields;
  const allData = res.data;
  const zip = new JSZip();
  let idx = 1;
  for(let i=0;i<allData.length;i+=limit){
    const slice = allData.slice(i,i+limit);
    const csv = Papa.unparse({fields,data:slice});
    zip.file(`分片${idx}.csv`, csv);
    idx++;
  }
  const zipBuf = await zip.generateAsync({type:"uint8array"});
  const blob = new Blob([zipBuf],{type:"application/zip"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "固定行数拆分包.zip";
  a.click();
}
</script>
</body>
</html>
