<h2><span class="i18n-zh">批量订单金额统计（一行一个数字）</span><span class="i18n-en" hidden>Batch Order Statistics</span></h2>
<textarea id="orderMoneyList" placeholder="每行粘贴一个订单金额"></textarea>
<button onclick="calcOrderSum()"><span class="i18n-zh">批量求和统计</span><span class="i18n-en" hidden>批量求和统计</span></button>
<p id="statResult"></p>
<script>
function calcOrderSum(){
    const lines = document.getElementById('orderMoneyList').value.split(/\r?\n/);
    let sum = 0;
    let count = 0;
    lines.forEach(line=>{
        const num = parseFloat(line.trim());
        if(!isNaN(num)){
            sum += num;
            count++;
        }
    });
    const avg = count>0 ? sum/count : 0;
    document.getElementById('statResult').innerText = `有效订单数：${count} 单
总金额：${sum.toFixed(2)} 元
平均单值：${avg.toFixed(2)} 元`;
}
</script>
