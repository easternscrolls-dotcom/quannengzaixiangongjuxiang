<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单金额批量求和统计</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:180px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
<button style="width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer" onclick="calcOrderSum()">批量求和</button>
<p id="statResult" style="font-size:18px;margin-top:16px;font-weight:bold"></p>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>批量订单金额统计（一行一个数字）</h2>
<textarea id="orderMoneyList" placeholder="每行粘贴一个订单金额"></textarea>
<button onclick="calcOrderSum()">批量求和统计</button>
<p id="statResult"></p>
<script>
function calcOrderSum(){
    const lines = document.getElementById('orderMoneyList').value.split(/\r?\n/);
    let sum = 0;
    let count = 0;
    lines.forEach(line=>{
        const num = parseFloat(line.trim());
        if(!isNaN(num)){
            sum += num;
            count++;
        }
    });
    const avg = count>0 ? sum/count : 0;
    document.getElementById('statResult').innerText = `有效订单数：${count} 单
总金额：${sum.toFixed(2)} 元
平均单值：${avg.toFixed(2)} 元`;
}
</script>
</body>
</html>
