<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多视频在线合并工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
#fileList{margin:12px 0;line-height:1.8}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>多个视频按上传顺序合并为单个MP4</h2>
<div class="upload-box">
<input type="file" accept="video/*" multiple id="videoInput">
<p style="margin-top:8px;color:#666">多选视频，顺序为播放顺序</p>
</div>
<div id="fileList"></div>
<button onclick="mergeVideo()">合并视频导出</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let fileArr = [];
document.getElementById('videoInput').onchange = e=>{
  fileArr = Array.from(e.target.files);
  let html = "已选择文件：<br/>";
  fileArr.forEach((f,i)=>html += `${i+1}. ${f.name}<br/>`);
  document.getElementById("fileList").innerHTML = html;
}
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function mergeVideo(){
  if(fileArr.length < 2) return alert("至少选择2个视频");
  await loadFFmpeg();
  let concatTxt = "";
  for(let i=0;i<fileArr.length;i++){
    const buf = new Uint8Array(await fileArr[i].arrayBuffer());
    ffmpeg.writeFile(`vid${i}.mp4`, buf);
    concatTxt += `file 'vid${i}.mp4'\n`;
  }
  ffmpeg.writeFile("list.txt", new TextEncoder().encode(concatTxt));
  await ffmpeg.exec(["-f", "concat", "-safe", "0", "-i", "list.txt", "-c", "copy", "merge_out.mp4"]);
  const outBuf = ffmpeg.readFile("merge_out.mp4");
  const blob = new Blob([outBuf],{type:"video/mp4"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "合并视频.mp4";
  a.click();
}
</script>
</body>
</html>
