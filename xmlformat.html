<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XML格式化与压缩</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:300px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:Consolas,monospace}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/xmldom@0.6.0/dist/xmldom.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prettify-xml@1.2.2/dist/prettify-xml.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>XML 格式化美化 / 压缩单行</h2>
<textarea id="xmlInput" placeholder="粘贴XML代码"></textarea>
<div class="btn-row">
<button onclick="formatXml()">格式化XML</button>
<button onclick="compressXml()">压缩为单行</button>
</div>
<textarea id="xmlOutput" readonly></textarea>
<script>
function formatXml(){
  const src = document.getElementById('xmlInput').value;
  try{
    const pretty = prettifyXml(src,{indent:"  "});
    document.getElementById('xmlOutput').value = pretty;
  }catch(e){
    document.getElementById('xmlOutput').value = "XML解析错误："+e.message;
  }
}
function compressXml(){
  const src = document.getElementById('xmlInput').value;
  const str = src.replace(/>\s+</g,"><").replace(/\s+/g," ");
  document.getElementById('xmlOutput').value = str.trim();
}
</script>
</body>
</html>
