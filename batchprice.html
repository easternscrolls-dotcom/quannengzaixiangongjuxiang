<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量加价/折扣定价换算</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:160px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0;font-family:monospace}
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0">
<select id="opType" style="padding:12px;border:1px solid #ddd;border-radius:6px">
<option value="rate">百分比加价/折扣</option>
<option value="fixed">固定金额加价</option>
</select>
<input id="numParam" placeholder="数值" step="0.01" type="number">
</div>
<button onclick="batchPriceCalc()" style="width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 0">批量计算</button>
<textarea id="priceOut" readonly style="width:100%;height:160px;padding:12px;border:1px solid #ddd;border-radius:6px;font-family:monospace"></textarea>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>批量成本价批量加价/打折定价（一行一个价格）</h2>
<textarea id="priceRaw" placeholder="每行输入一个成本价"></textarea>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0">
<select id="opType">
<option value="rate">百分比加价(正数)/折扣(负数)</option>
<option value="fixed">固定金额加减</option>
</select>
<input id="numParam" placeholder="数值，如 30 / -15" step="0.01" type="number">
</div>
<button onclick="batchPriceCalc()">批量计算售价</button>
<textarea id="priceOut" readonly></textarea>
<script>
function batchPriceCalc(){
    const lines = document.getElementById('priceRaw').value.split(/\r?\n/).filter(s=>s.trim());
    const op = document.getElementById('opType').value;
    const param = parseFloat(document.getElementById('numParam').value);
    const res = [];
    lines.forEach(line=>{
        const cost = parseFloat(line.trim());
        let sell;
        if(op === "rate"){
            sell = cost * (1 + param/100);
        }else{
            sell = cost + param;
        }
        res.push(sell.toFixed(2));
    });
    document.getElementById('priceOut').value = res.join("\n");
}
</script>
</body>
</html>
