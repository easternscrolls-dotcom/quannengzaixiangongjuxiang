<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron表达式解析生成</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
textarea{width:100%;height:220px;padding:12px;border:1px solid #ddd;border-radius:6px;margin-top:10px;font-family:monospace}
</style>
<script src="https://cdn.jsdelivr.net/npm/cron-parser@4.9.0/dist/cron-parser.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>Cron表达式解析，预览下次执行时间</h2>
<input id="cronInput" placeholder="输入cron 例如：0 0 * * *">
<button onclick="parseCron()">解析Cron表达式</button>
<textarea id="cronOutput" readonly></textarea>
<script>
function parseCron(){
  const expr = document.getElementById('cronInput').value.trim();
  try{
    const interval = cronParser.parseExpression(expr);
    const list = [];
    list.push("表达式："+expr);
    list.push("");
    list.push("未来10次执行时间：");
    for(let i=0;i<10;i++){
      const next = interval.next();
      list.push(next.toLocaleString());
    }
    document.getElementById('cronOutput').value = list.join("\n");
  }catch(e){
    document.getElementById('cronOutput').value = "Cron表达式非法："+e.message;
  }
}
</script>
</body>
</html>
