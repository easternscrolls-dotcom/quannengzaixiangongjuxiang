<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码缩进统一工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:260px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:Consolas,monospace}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input{padding:12px;border:1px solid #ddd;border-radius:6px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 0}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>代码缩进转换：空格 ↔ Tab</h2>
<textarea id="codeInput" placeholder="粘贴代码"></textarea>
<div class="row">
<select id="indentFrom">
<option value="space">来源：空格缩进</option>
<option value="tab">来源：Tab缩进</option>
</select>
<select id="indentTo">
<option value="space">转为空格缩进</option>
<option value="tab">转为Tab缩进</option>
</select>
</div>
<input id="indentSize" placeholder="每级缩进空格数" value="4">
<button onclick="convertIndent()">执行缩进转换</button>
<textarea id="codeOutput" readonly></textarea>
<script>
function convertIndent(){
  let code = document.getElementById('codeInput').value;
  const from = document.getElementById('indentFrom').value;
  const to = document.getElementById('indentTo').value;
  const size = parseInt(document.getElementById('indentSize').value)||4;
  const spaceStr = " ".repeat(size);
  if(from === "space" && to === "tab"){
    code = code.replace(new RegExp("^"+spaceStr,"gm"),"\t");
  }else if(from === "tab" && to === "space"){
    code = code.replace(/^\t/gm, spaceStr);
  }
  document.getElementById('codeOutput').value = code;
}
</script>
</body>
</html>
