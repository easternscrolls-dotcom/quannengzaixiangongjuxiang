<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频嵌入硬字幕工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:40px;text-align:center;margin:12px 0;border-radius:8px}
textarea{width:100%;height:160px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
p.tip{color:#666}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>视频嵌入文字硬字幕</h2>
<p class="tip">字幕格式示例：00:00:01,000 --> 00:00:04,000 这是一行字幕</p>
<div class="upload-box">
<input type="file" accept="video/*" id="videoFile">
</div>
<textarea id="subText" placeholder="粘贴SRT字幕内容"></textarea>
<button onclick="addSubtitle()">合成带字幕视频</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let sourceVid = null;
document.getElementById('videoFile').onchange = e=>sourceVid = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function addSubtitle(){
  if(!sourceVid || !subText.value.trim()) return alert("上传视频并粘贴字幕");
  await loadFFmpeg();
  const vidBuf = new Uint8Array(await sourceVid.arrayBuffer());
  ffmpeg.writeFile("video.mp4", vidBuf);
  ffmpeg.writeFile("sub.srt", new TextEncoder().encode(subText.value));
  await ffmpeg.exec(["-i","video.mp4","-vf","subtitles=sub.srt","sub_out.mp4"]);
  const outBuf = ffmpeg.readFile("sub_out.mp4");
  const blob = new Blob([outBuf],{type:"video/mp4"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "带字幕视频.mp4";
  a.click();
}
</script>
</body>
</html>
