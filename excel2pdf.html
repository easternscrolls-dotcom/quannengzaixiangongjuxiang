<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel表格XLSX转PDF工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
textarea{width:100%;height:180px;padding:12px;border:1px solid #ddd;margin:10px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>Excel XLSX转PDF表格</h2>
<div class="upload-box">
<input type="file" accept=".xlsx,.xls" id="excelFile">
</div>
<textarea id="excelPreview" readonly></textarea>
<button onclick="excelToPdf()">导出PDF表格</button>
<script>
const { jsPDF } = window.jspdf;
let tableText = "";
document.getElementById('excelFile').onchange = async e=>{
  const f = e.target.files[0];
  const buf = await f.arrayBuffer();
  const wb = XLSX.read(buf);
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const jsonData = XLSX.utils.sheet_to_json(sheet,{header:1});
  tableText = jsonData.map(row=>row.join("\t")).join("\n");
  excelPreview.value = tableText;
}
function excelToPdf(){
  if(!tableText) return alert("请上传Excel文件");
  const doc = new jsPDF('l','mm','a4');
  doc.setFont("simhei");
  doc.text(tableText,10,12,{maxWidth:280});
  doc.save("excel表格.pdf");
}
</script>
</body>
</html>
