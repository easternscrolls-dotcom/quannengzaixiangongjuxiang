<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片自定义缩放尺寸工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
.size-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
#preview{max-width:100%;margin:15px 0;display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>图片宽高缩放，支持等比例压缩</h2>
<div class="upload-box">
<input type="file" accept="image/*" id="imgFile">
</div>
<img id="preview">
<div class="size-row">
<input id="wInput" placeholder="宽度px" value="800">
<input id="hInput" placeholder="高度px" value="600">
</div>
<button onclick="resizeImg()">缩放并下载图片</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let imgBlob = null;
document.getElementById('imgFile').onchange = e=>{
  imgBlob = e.target.files[0];
  preview.src = URL.createObjectURL(imgBlob);
  preview.style.display = "block";
}
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function resizeImg(){
  if(!imgBlob) return alert("上传图片");
  const w = wInput.value;
  const h = hInput.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await imgBlob.arrayBuffer());
  ffmpeg.writeFile("src.png", buf);
  await ffmpeg.exec(["-i","src.png","-vf",`scale=${w}:${h}`,"resize_out.png"]);
  const outBuf = ffmpeg.readFile("resize_out.png");
  const blob = new Blob([outBuf],{type:"image/png"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "缩放图片.png";
  a.click();
}
</script>
</body>
</html>
