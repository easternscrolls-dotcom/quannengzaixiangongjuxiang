<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常用正则模板 手机号/邮箱/身份证</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
textarea{width:100%;height:180px;padding:12px;border:1px solid #ddd;border-radius:6px;margin-top:10px;font-family:monospace}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>常用正则表达式模板（表单验证、爬虫筛选）</h2>
<select id="regTemplateSelect">
<option value="phone">国内手机号正则</option>
<option value="email">邮箱正则</option>
<option value="idcard">18位身份证正则</option>
<option value="url">URL链接正则</option>
<option value="chinese">纯中文正则</option>
</select>
<button onclick="getRegTemplate()">获取正则模板</button>
<textarea id="regTemplateOut" readonly></textarea>
<script>
const regMap = {
phone:"^1[3-9]\\d{9}$",
email:"^[a-zA-Z0-9_-]+@[a-zA-Z0-9_-]+(\\.[a-zA-Z0-9_-]+)+$",
idcard:"^[1-9]\\d{5}(19|20)\\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\\d|3[01])\\d{3}[0-9Xx]$",
url:"https?://[\\w\\-]+(\\.[\\w\\-]+)+[\\w\\-./?&=%#]*",
chinese:"[\\u4e00-\\u9fa5]"
};
function getRegTemplate(){
  const key = document.getElementById('regTemplateSelect').value;
  document.getElementById('regTemplateOut').value = regMap[key];
}
</script>
</body>
</html>
