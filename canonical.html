<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canonical标准链接标签生成</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
textarea{width:100%;height:120px;padding:12px;border:1px solid #ddd;border-radius:6px;margin-top:10px;font-family:monospace}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>rel="canonical" 标准链接标签生成（解决重复页面收录）</h2>
<input id="canonUrl" placeholder="填写规范标准URL">
<button onclick="buildCanonical()">生成代码</button>
<textarea id="canonOutput" readonly></textarea>
<script>
function buildCanonical(){
  const url = document.getElementById('canonUrl').value.trim();
  const code = `<link rel="canonical" href="${url}">`;
  document.getElementById('canonOutput').value = code;
}
</script>
</body>
</html>
