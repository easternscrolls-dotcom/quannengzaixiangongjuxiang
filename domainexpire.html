<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>域名到期倒计时计算</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
p#dayResult{font-size:20px;margin-top:16px;font-weight:bold}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>域名到期剩余天数计算</h2>
<input id="expireDate" placeholder="到期日期 2027-08-15">
<button onclick="calcExpireDay()">计算剩余天数</button>
<p id="dayResult"></p>
<script>
function calcExpireDay(){
  const dateStr = document.getElementById('expireDate').value.trim();
  const expire = new Date(dateStr);
  const now = new Date();
  if(isNaN(expire.getTime())){alert("日期格式错误");return;}
  const diff = Math.ceil((expire.getTime()-now.getTime())/(1000*3600*24));
  if(diff>0){
    document.getElementById('dayResult').innerText = `距离到期剩余 ${diff} 天`;
  }else{
    document.getElementById('dayResult').innerText = `域名已过期 ${Math.abs(diff)} 天`;
  }
}
</script>
</body>
</html>
