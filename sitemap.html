<h1 style="margin:16px 0;font-size:22px;">站点地图生成工具</h1>
<p class="tool-desc" style="margin:4px 0 18px;color:#6b7280;font-size:14px;line-height:1.7;">站点地图生成工具 是一款免费在线工具，无需下载安装，打开网页即可直接使用。支持常见图片格式，在线处理、即时预览，不占用本地存储空间。</p>

<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>Sitemap.xml 站点地图生成（每行一条URL）</h2>
<textarea id="urlList" placeholder="每行填写一条完整链接"></textarea>
<div class="row">
<select id="prioritySel">
<option value="1.0">优先级 1.0</option>
<option value="0.8" selected>优先级 0.8</option>
<option value="0.6">优先级 0.6</option>
<option value="0.4">优先级 0.4</option>
</select>
<select id="changefreq">
<option value="always">always</option>
<option value="daily" selected>daily</option>
<option value="weekly">weekly</option>
<option value="monthly">monthly</option>
</select>
<input id="lastmod" placeholder="lastmod 留空使用今日日期">
</div>
<button onclick="buildSitemap()">生成Sitemap XML</button>
<textarea id="xmlOutput" readonly></textarea>
<script>
function getToday(){
  const d=new Date();
  const y=d.getFullYear();
  const m=(d.getMonth()+1).toString().padStart(2,"0");
  const day=d.getDate().toString().padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function buildSitemap(){
  const urls = document.getElementById('urlList').value.split(/\r?\n/).filter(s=>s.trim());
  const priority = document.getElementById('prioritySel').value;
  const freq = document.getElementById('changefreq').value;
  let lastmod = document.getElementById('lastmod').value.trim() || getToday();
  let xml = `<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
`;
  urls.forEach(u=>{
    const link = u.trim();
    xml += `<url>
  <loc>${link}</loc>
  <lastmod>${lastmod}</lastmod>
  <changefreq>${freq}</changefreq>
  <priority>${priority}</priority>
</url>
`;
  })
  xml += "</urlset>";
  document.getElementById('xmlOutput').value = xml;
}
</script>

<!-- Cookie弹窗开始 -->
<div id="cookieBox" style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:16px 24px;z-index:9999;display:none;">
    <div style="max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:16px;">
        <div style="flex:1;min-width:300px;">
            <p style="margin:0 0 6px 0;font-size:14px;color:#333;">🍪 Cookie 使用提示</p>
            <p style="margin:0;font-size:13px;color:#666;">
                本站使用Cookie优化访问体验，并投放Google联盟广告。继续使用网站即代表您同意我们的Cookie政策，您可查看<a href="/privacy.html" style="color:#0066cc;">隐私政策</a>。
            </p>
        </div>
        <div style="display:flex;gap:10px;">
            <button id="cookieAccept" style="padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;">同意</button>
            <button id="cookieReject" style="padding:8px 18px;background:#eee;color:#333;border:none;border-radius:6px;cursor:pointer;">拒绝</button>
        </div>
    </div>
</div>

<script>
const cookieBox = document.getElementById('cookieBox');
const acceptBtn = document.getElementById('cookieAccept');
const rejectBtn = document.getElementById('cookieReject');
const cookieStatus = localStorage.getItem('cookieConsent');
if (!cookieStatus) {
    cookieBox.style.display = 'block';
}
acceptBtn.onclick = function(){
    localStorage.setItem('cookieConsent','accept');
    cookieBox.style.display = 'none';
};
rejectBtn.onclick = function(){
    localStorage.setItem('cookieConsent','reject');
    cookieBox.style.display = 'none';
};
</script>
