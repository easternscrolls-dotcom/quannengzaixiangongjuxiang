<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF动图压缩瘦身工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>GIF动图压缩减小体积</h2>
<div class="upload-box">
<input type="file" accept=".gif" id="gifFile">
</div>
<select id="gifFps">
<option value="6">高压缩 6帧</option>
<option value="10" selected>均衡 10帧</option>
<option value="15">高清 15帧</option>
</select>
<button onclick="compressGif()">压缩GIF并下载</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let gifBlob = null;
document.getElementById('gifFile').onchange = e=>gifBlob = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function compressGif(){
  if(!gifBlob) return alert("上传GIF文件");
  const fps = gifFps.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await gifBlob.arrayBuffer());
  ffmpeg.writeFile("source.gif", buf);
  await ffmpeg.exec(["-i","source.gif","-vf",`fps=${fps},scale=480:-1`,"compressed.gif"]);
  const outBuf = ffmpeg.readFile("compressed.gif");
  const blob = new Blob([outBuf],{type:"image/gif"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "压缩动图.gif";
  a.click();
}
</script>
</body>
</html>
