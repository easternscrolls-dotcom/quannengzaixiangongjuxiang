<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>robots.txt 规则生成器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:260px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>robots.txt 搜索引擎爬虫规则生成</h2>
<textarea id="robotsInput" placeholder="禁止路径一行一条，例：/admin/"></textarea>
<button onclick="makeRobots()">生成robots.txt</button>
<textarea id="robotsOutput" readonly></textarea>
<script>
function makeRobots(){
  const blocks = document.getElementById('robotsInput').value.split(/\r?\n/).filter(s=>s.trim());
  let txt = `User-agent: *
`;
  blocks.forEach(path=>{
    txt += `Disallow: ${path.trim()}\n`;
  })
  txt += `Allow: /
Sitemap: https://你的域名/sitemap.xml
`;
  document.getElementById('robotsOutput').value = txt;
}
</script>
</body>
</html>
