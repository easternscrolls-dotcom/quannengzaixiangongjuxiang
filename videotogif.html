<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频转GIF动图工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>视频截取片段导出GIF动图</h2>
<div class="upload-box">
<input type="file" accept="video/*" id="videoFile">
</div>
<input id="gifSize" placeholder="GIF宽度，推荐480" value="480">
<button onclick="videoToGif()">生成GIF</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let vidFile = null;
document.getElementById('videoFile').onchange = e=>vidFile = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function videoToGif(){
  if(!vidFile) return alert("请上传视频文件");
  const w = gifSize.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await vidFile.arrayBuffer());
  ffmpeg.writeFile("input.mp4", buf);
  await ffmpeg.exec(["-i","input.mp4","-vf",`fps=12,scale=${w}:-1`,"out.gif"]);
  const outData = ffmpeg.readFile("out.gif");
  const blob = new Blob([outData],{type:"image/gif"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "动图.gif";
  a.click();
}
</script>
</body>
</html>
