<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV按列值拆分多个文件</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>按指定列内容自动拆分为多个CSV，打包下载</h2>
<div class="upload-box">
<input type="file" accept=".csv" id="csvFile">
</div>
<input id="splitCol" placeholder="拆分分组列名称">
<button onclick="splitCsvByCol()">开始拆分打包</button>
<script>
document.getElementById('csvFile').onchange = e=>window.csvFileObj = e.target.files[0];
async function splitCsvByCol(){
  const col = document.getElementById('splitCol').value.trim();
  if(!window.csvFileObj || !col) return alert("上传文件+填写分组列");
  const text = await window.csvFileObj.text();
  const res = Papa.parse(text,{header:true,skipEmptyLines:true});
  const groupMap = {};
  res.data.forEach(row=>{
    const key = row[col] || "空分组";
    if(!groupMap[key]) groupMap[key] = [];
    groupMap[key].push(row);
  })
  const zip = new JSZip();
  for(let key in groupMap){
    const csv = Papa.unparse({fields:res.meta.fields,data:groupMap[key]});
    zip.file(`${key}.csv`, csv);
  }
  const zipBuf = await zip.generateAsync({type:"uint8array"});
  const blob = new Blob([zipBuf],{type:"application/zip"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "拆分表格包.zip";
  a.click();
}
</script>
</body>
</html>
