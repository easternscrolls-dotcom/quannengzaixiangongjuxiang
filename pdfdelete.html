<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF删除指定页面工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>删除PDF指定页面</h2>
<div class="upload-box">
<input type="file" accept=".pdf" id="pdfFile">
</div>
<input id="delPageInput" placeholder="需删除页码，例：2,4-6">
<button onclick="deletePdfPage()">删除页面并导出</button>
<script>
const { PDFDocument } = window.PDFLib;
function parseDelRule(str, total){
  const delSet = new Set();
  str.split(',').forEach(item=>{
    if(item.includes('-')){
      let [s,e] = item.split('-').map(Number);
      for(let i=s;i<=e;i++) delSet.add(i-1);
    }else delSet.add(Number(item)-1);
  })
  const keepIdx = [];
  for(let i=0;i<total;i++){
    if(!delSet.has(i)) keepIdx.push(i);
  }
  return keepIdx;
}
async function deletePdfPage(){
  const file = document.getElementById('pdfFile').files[0];
  const rule = document.getElementById('delPageInput').value.trim();
  if(!file || !rule) return alert("上传PDF并填写删除页码");
  const buf = await file.arrayBuffer();
  const srcPdf = await PDFDocument.load(buf);
  const total = srcPdf.getPageCount();
  const keepPages = parseDelRule(rule, total);
  if(keepPages.length===0) return alert("删除后无剩余页面");
  const newPdf = await PDFDocument.create();
  const copyPages = await newPdf.copyPages(srcPdf, keepPages);
  copyPages.forEach(p=>newPdf.addPage(p));
  const outBuf = await newPdf.save();
  const blob = new Blob([outBuf],{type:"application/pdf"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "删除页面后文档.pdf";
  a.click();
}
</script>
</body>
</html>
