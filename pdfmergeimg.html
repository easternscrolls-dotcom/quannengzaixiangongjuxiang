<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF和图片合并为一个文档</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>PDF文件 + 多张图片合并成单个PDF</h2>
<div class="upload-box">
<input type="file" accept=".pdf,image/*" multiple id="mergeFile">
<p style="margin-top:8px;color:#666">同时上传PDF与图片，按上传顺序合并</p>
</div>
<button onclick="mergePdfAndImg()">合并导出完整PDF</button>
<script>
const { PDFDocument } = window.PDFLib;
async function mergePdfAndImg(){
  const files = Array.from(document.getElementById('mergeFile').files);
  if(files.length < 2) return alert("至少上传1个PDF+1张图片");
  const targetPdf = await PDFDocument.create();
  for(let f of files){
    const buf = await f.arrayBuffer();
    const name = f.name.toLowerCase();
    if(name.endsWith(".pdf")){
      const src = await PDFDocument.load(buf);
      const pages = await targetPdf.copyPages(src, src.getPageIndices());
      pages.forEach(p=>targetPdf.addPage(p));
    }else{
      let embedImg;
      if(name.endsWith(".png")) embedImg = await targetPdf.embedPng(buf);
      else embedImg = await targetPdf.embedJpg(buf);
      const page = targetPdf.addPage([embedImg.width, embedImg.height]);
      page.drawImage(embedImg,0,0);
    }
  }
  const outBuf = await targetPdf.save();
  const blob = new Blob([outBuf],{type:"application/pdf"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "PDF图片合并文档.pdf";
  a.click();
}
</script>
</body>
</html>
