<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF添加水印 自定义透明文字水印</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:6px;font-size:15px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>PDF批量添加透明文字水印</h2>
<div class="upload-box">
<input type="file" accept=".pdf" id="pdfFile">
</div>
<input id="waterText" placeholder="输入水印文字" value="内部文档 禁止外传">
<button onclick="addWatermark()">生成带水印PDF</button>
<script>
const { PDFDocument, rgb } = window.PDFLib;
async function addWatermark(){
  const file = document.getElementById('pdfFile').files[0];
  const wText = document.getElementById('waterText').value.trim();
  if(!file || !wText) return alert("上传PDF并填写水印文字");
  const srcBuf = await file.arrayBuffer();
  const pdf = await PDFDocument.load(srcBuf);
  const font = await pdf.embedFont(PDFDocument.Fonts.Helvetica);
  const pages = pdf.getPages();
  for(let page of pages){
    const { width, height } = page.getSize();
    // 对角线水印重复绘制
    page.drawText(wText,{x:20,y:height/2,size:38,font,color:rgb(0.72,0.72,0.72),opacity:0.28,rotate:Math.PI/4});
    page.drawText(wText,{x:width/2,y:height/4,size:38,font,color:rgb(0.72,0.72,0.72),opacity:0.28,rotate:Math.PI/4});
    page.drawText(wText,{x:width/4,y:height*0.75,size:38,font,color:rgb(0.72,0.72,0.72),opacity:0.28,rotate:Math.PI/4});
  }
  const outBuf = await pdf.save();
  const blob = new Blob([outBuf],{type:"application/pdf"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "带水印文档.pdf";
  a.click();
}
</script>
</body>
</html>
