<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频采样率转换工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>音频采样率转换 8k/16k/44100/48000</h2>
<div class="upload-box">
<input type="file" accept="audio/*" id="audioFile">
</div>
<select id="sampleSel">
<option value="8000">8000Hz 语音低音质</option>
<option value="16000">16000Hz 录音常用</option>
<option value="44100" selected>44100Hz 标准音乐</option>
<option value="48000">48000Hz 高清</option>
</select>
<button onclick="changeSampleRate()">转换采样率导出</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let sourceAud = null;
document.getElementById('audioFile').onchange = e=>sourceAud = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function changeSampleRate(){
  if(!sourceAud) return alert("上传音频");
  const sr = sampleSel.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await sourceAud.arrayBuffer());
  ffmpeg.writeFile("in.mp3", buf);
  await ffmpeg.exec(["-i","in.mp3","-ar",sr,"sample_out.mp3"]);
  const outBuf = ffmpeg.readFile("sample_out.mp3");
  const blob = new Blob([outBuf],{type:"audio/mpeg"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${sr}Hz音频.mp3`;
  a.click();
}
</script>
</body>
</html>
