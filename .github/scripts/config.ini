; ============================================================
; 72tool 博客滴灌发布 —— GitHub Actions 云端配置
; 说明：本文件会进入 Git 仓库，**严禁写入任何密钥**。
;       API Key / 端点 / 模型由 Actions 的 Repository Secrets
;       通过环境变量注入（BLOG_API_KEY / BLOG_API_BASE / BLOG_MODEL），
;       站点根目录由 BLOG_SITE_DIR 注入（= 仓库根目录）。
;       只想调节奏的话，改下面 [drip] 段即可，不用碰代码。
; ============================================================

[general]
site = https://72tool.com

[blog]
enabled = True
; 云端固定用 api 模式（智谱），失败会自动回退内置模板，保证不断更
mode = api
; 以下三项留空 —— 运行时由 Secrets 注入，请勿在此填写
api_base =
api_key =
model =
; blog_dir / tools_html 留空 —— 由 BLOG_SITE_DIR 自动推导为仓库内路径
blog_dir =
tools_html =
max_articles = 0
update_sitemap = True

[drip]
; 滴灌发布节奏 —— 想调快/调慢只改这里
enabled = True
; 每天发布篇数区间（按日期做种子随机取 5 或 6）
daily_min = 5
daily_max = 6
; 发布时间窗（北京时间，24 小时制）
window_start = 9
window_end = 22
; 相邻两篇最小间隔（分钟）
min_gap_minutes = 60
; 单次运行最多发几篇（1 = 每次只发一篇，避免集中上线）
max_per_run = 1
; 云端必须为 True，否则文章不会推到仓库
auto_push = True
