<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL参数解析提取工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:140px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
button{width:100%;padding:12px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
textarea#out{height:260px}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>解析URL域名、路径、Query参数</h2>
<textarea id="urlParseInput" placeholder="粘贴完整URL链接"></textarea>
<button onclick="parseUrl()">解析URL</button>
<textarea id="urlParseOut" readonly></textarea>
<script>
function parseUrl(){
  const urlStr = document.getElementById('urlParseInput').value.trim();
  try{
    const url = new URL(urlStr);
    const params = Object.fromEntries(url.searchParams.entries());
    const data = {
      href:url.href,
      protocol:url.protocol,
      host:url.host,
      hostname:url.hostname,
      port:url.port,
      pathname:url.pathname,
      search:url.search,
      hash:url.hash,
      params:params
    };
    document.getElementById('urlParseOut').value = JSON.stringify(data,null,2);
  }catch(e){
    document.getElementById('urlParseOut').value = "URL解析失败："+e.message;
  }
}
</script>
</body>
</html>
