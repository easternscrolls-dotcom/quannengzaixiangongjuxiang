<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown自媒体文案排版整理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:240px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px;background:#2478f5;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>自媒体Markdown文案整理：清理空行、规范列表缩进</h2>
<textarea id="mdInput"></textarea>
<div class="btn-row">
<button onclick="cleanMd()">清理多余空行</button>
<button onclick="fixList()">统一列表格式</button>
</div>
<textarea id="mdOutput" readonly></textarea>
<script>
function cleanMd(){
  const lines = document.getElementById("mdInput").value.split(/\r?\n/).filter(s=>s.trim()!=='');
  document.getElementById("mdOutput").value = lines.join("\n");
}
function fixList(){
  let txt = document.getElementById("mdInput").value;
  txt = txt.replace(/^(\s*)-\s+/gm,"- ");
  document.getElementById("mdOutput").value = txt;
}
</script>
</body>
</html>
