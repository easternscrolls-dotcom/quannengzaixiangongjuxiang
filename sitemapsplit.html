<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sitemap索引文件拆分生成</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:200px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
textarea#splitOut{height:220px}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>Sitemap索引文件生成（超5万链接拆分多个sitemap）</h2>
<div class="row">
<input id="baseSitemapUrl" placeholder="sitemap基础地址 https://xxx.com/sitemap">
<input id="maxCount" placeholder="每个文件最大链接数" value="45000">
</div>
<textarea id="sitemapNameList" placeholder="每行填写一个sitemap文件名 sitemap1.xml"></textarea>
<button onclick="buildSitemapIndex()">生成sitemap索引xml</button>
<textarea id="splitOut" readonly></textarea>
<script>
function buildSitemapIndex(){
  const base = document.getElementById('baseSitemapUrl').value.trim();
  const lines = document.getElementById('sitemapNameList').value.split(/\r?\n/).filter(s=>s.trim());
  let xml = `<?xml version="1.0" encoding="UTF-8"?>
<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
`;
  lines.forEach(name=>{
    xml += `<sitemap>
  <loc>${base}/${name.trim()}</loc>
</sitemap>
`;
  });
  xml += "</sitemapindex>";
  document.getElementById('splitOut').value = xml;
}
</script>
</body>
</html>
