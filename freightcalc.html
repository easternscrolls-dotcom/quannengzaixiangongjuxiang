<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快递首重续重运费计算器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 0}
#resultOut{padding:12px;border:1px solid #ddd;border-radius:6px;white-space:pre-line}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>快递运费｜首重、续重测算（kg）</h2>
<input id="weight" placeholder="包裹总重量 kg" step="0.01" type="number">
<input id="firstWeight" placeholder="首重 kg" value="1" step="0.01" type="number">
<input id="firstPrice" placeholder="首重价格" step="0.01" type="number">
<input id="addPrice" placeholder="每kg续重价格" step="0.01" type="number">
<button onclick="calcFreight()">计算运费</button>
<div id="resultOut"></div>
<script>
function calcFreight(){
    const w = parseFloat(document.getElementById('weight').value);
    const fw = parseFloat(document.getElementById('firstWeight').value);
    const fp = parseFloat(document.getElementById('firstPrice').value);
    const ap = parseFloat(document.getElementById('addPrice').value);
    if(isNaN(w)||w<=0){alert("填写有效重量");return;}
    let freight;
    if(w <= fw){
        freight = fp;
    }else{
        const addWeight = Math.ceil(w-fw);
        freight = fp + addWeight * ap;
    }
    document.getElementById('resultOut').innerText = `预估运费：${freight.toFixed(2)} 元`;
}
</script>
</body>
</html>
