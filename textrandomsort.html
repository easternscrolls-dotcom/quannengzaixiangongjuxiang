<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本行随机打乱顺序</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:240px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>多行文本随机打乱行顺序</h2>
<textarea id="randInput"></textarea>
<button onclick="shuffleLines()">随机打乱行</button>
<textarea id="randOutput" readonly></textarea>
<script>
function shuffleLines(){
  const lines = document.getElementById('randInput').value.split(/\r?\n/);
  // Fisher-Yates 洗牌算法
  for(let i=lines.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [lines[i],lines[j]] = [lines[j],lines[i]];
  }
  document.getElementById('randOutput').value = lines.join("\n");
}
</script>
</body>
</html>
