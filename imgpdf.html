<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多张图片合并PDF工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
#fileList{margin:12px 0;line-height:1.8}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>批量图片合并生成PDF文档</h2>
<div class="upload-box">
<input type="file" accept="image/*" multiple id="imgInput">
<p style="margin-top:8px;color:#666">上传多张图片，按顺序分页</p>
</div>
<div id="fileList"></div>
<button onclick="imgToPdf()">合成PDF下载</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let imgArr = [];
document.getElementById('imgInput').onchange = e=>{
  imgArr = Array.from(e.target.files);
  let html = "待合并图片：<br/>";
  imgArr.forEach((f,i)=>html += `${i+1}. ${f.name}<br/>`);
  fileList.innerHTML = html;
}
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function imgToPdf(){
  if(imgArr.length < 1) return alert("至少上传一张图片");
  await loadFFmpeg();
  const inputCmd = [];
  for(let i=0;i<imgArr.length;i++){
    const buf = new Uint8Array(await imgArr[i].arrayBuffer());
    ffmpeg.writeFile(`page${i}.png`, buf);
    inputCmd.push("-i",`page${i}.png`);
  }
  await ffmpeg.exec([...inputCmd,"-filter_complex",`concat=n=${imgArr.length}:v=1:a=0`,"out.pdf"]);
  const outBuf = ffmpeg.readFile("out.pdf");
  const blob = new Blob([outBuf],{type:"application/pdf"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "图片合并文档.pdf";
  a.click();
}
</script>
</body>
</html>
