<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淘宝商品标题60字符检测</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:140px;padding:12px;border:1px solid #ddd;border-radius:6px;font-family:monospace}
#tipBox{margin-top:12px;padding:12px;border-radius:8px;font-size:16px}
.ok{background:#e6f9e6;color:#086608}
.warn{background:#fff9e6;color:#995c00}
.err{background:#ffe6e6;color:#b30000}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>淘宝商品标题字符检测｜上限60字符</h2>
<textarea id="titleText" oninput="checkTitleLength()" placeholder="粘贴商品标题"></textarea>
<div id="tipBox"></div>
<script>
function checkTitleLength(){
    const txt = document.getElementById('titleText').value;
    const len = txt.length;
    const box = document.getElementById('tipBox');
    box.className = "";
    if(len <=52){
        box.innerText = `当前：${len}字符，空间充足`;
        box.className = "ok";
    }else if(len <=60){
        box.innerText = `当前：${len}字符，接近上限`;
        box.className = "warn";
    }else{
        box.innerText = `当前：${len}字符 ❌ 超出60字符限制，搜索会被截断`;
        box.className = "err";
    }
}
</script>
</body>
</html>
