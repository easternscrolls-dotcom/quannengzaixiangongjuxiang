<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移动端适配预览器 | 72在线工具箱</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f4f6;color:#111;}
  header{background:#111827;color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
  header h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap;}
  .ctrl{display:flex;gap:6px;align-items:center;}
  label{font-size:13px;color:#cbd5e1;}
  select,input,button{font-size:14px;padding:7px 10px;border-radius:6px;border:1px solid #d1d5db;}
  input{width:190px;}
  button{background:#2563eb;color:#fff;border:none;cursor:pointer;}
  button.ghost{background:#374151;}
  .presets{display:flex;gap:6px;flex-wrap:wrap;}
  .presets button{background:#2563eb;}
  .stage{display:flex;gap:28px;padding:24px;flex-wrap:wrap;align-items:flex-start;}
  .col{flex:0 0 auto;}
  .col h2{font-size:13px;color:#374151;margin:0 0 10px;font-weight:600;}
  .device{background:#fff;border:12px solid #111;border-radius:40px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.18);transition:width .2s,height .2s;}
  .device iframe{display:block;border:none;background:#fff;}
  .desktop{background:#fff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.08);}
  .desktop iframe{display:block;border:none;background:#fff;}
  .note{color:#6b7280;font-size:12px;margin:0 0 4px;}
  .err{color:#b91c1c;font-size:12px;display:none;}
</style>
    <!-- adsense --><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1495097009978965" crossorigin="anonymous"></script>
</head>
<body>
<header>
  <h1>📱 移动端适配预览器</h1>
  <div class="ctrl">
    <label>设备</label>
    <select id="device">
      <option value="375x667">iPhone SE (375)</option>
      <option value="390x844" selected>iPhone 14 (390)</option>
      <option value="414x896">Pixel 7 (414)</option>
      <option value="360x800">安卓小屏 (360)</option>
      <option value="768x1024">iPad 竖屏 (768)</option>
    </select>
  </div>
  <div class="ctrl">
    <label>工具页</label>
    <input id="page" value="json.html">
    <button id="go">打开</button>
  </div>
  <div class="ctrl"><button id="rotate" class="ghost">⇄ 横屏</button></div>
  <div class="ctrl presets" id="presets"></div>
</header>

<div class="stage">
  <div class="col">
    <p class="note">📱 手机视图（当前设备宽度，真实渲染）</p>
    <div class="device" id="dev"><iframe id="m" src="json.html"></iframe></div>
    <p class="err" id="merr">⚠ 该页面未找到，检查文件名（同目录下的 .html）</p>
  </div>
  <div class="col">
    <p class="note">💻 桌面视图（1200px 参考，用于对比）</p>
    <div class="desktop" id="desk"><iframe id="d" src="json.html" style="width:1200px;height:820px;"></iframe></div>
  </div>
</div>

<script>
  const device = document.getElementById('device');
  const page = document.getElementById('page');
  const m = document.getElementById('m');
  const d = document.getElementById('d');
  const dev = document.getElementById('dev');
  const merr = document.getElementById('merr');
  let rotated = false;

  const presets = ['index.html','json.html','base64.html','csvmerge.html','imgresize.html','bmi.html','pdfmerge.html','videoconvert.html','unitlength.html','timestamp.html'];
  const box = document.getElementById('presets');
  presets.forEach(p=>{
    const b=document.createElement('button');
    b.textContent=p.replace('.html','');
    b.onclick=()=>{ page.value=p; apply(); };
    box.appendChild(b);
  });

  function apply(){
    const [w,h]=device.value.split('x').map(Number);
    const fw = rotated ? h : w;
    const fh = rotated ? w : h;
    m.width=fw; m.height=fh;
    dev.style.width=(fw+24)+'px';
    dev.style.height=(fh+24)+'px';
    const p = (page.value.trim()||'index.html');
    m.src=p; d.src=p;
    merr.style.display='none';
    m.onerror=()=>{ merr.style.display='block'; };
  }

  document.getElementById('go').onclick=apply;
  page.addEventListener('keydown',e=>{ if(e.key==='Enter') apply(); });
  device.onchange=apply;
  document.getElementById('rotate').onclick=()=>{ rotated=!rotated; apply(); };

  apply();
</script>
</body>
</html>
