<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关键词密度计算工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:240px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
<p id="densityResult" style="font-size:18px;margin-top:16px;font-weight:bold;"></p>
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>SEO关键词密度计算（建议2%-8%）</h2>
<textarea id="articleText" placeholder="粘贴文章正文"></textarea>
<input id="keywordInput" placeholder="目标关键词">
<button onclick="calcKeywordDensity()">计算密度</button>
<p id="densityResult"></p>
<script>
function calcKeywordDensity(){
  const text = document.getElementById('articleText').value.trim();
  const kw = document.getElementById('keywordInput').value.trim();
  if(!kw){alert("请输入关键词");return;}
  const totalChars = text.length;
  const matchArr = text.match(new RegExp(kw,"g")) || [];
  const count = matchArr.length;
  const density = totalChars>0 ? (count * kw.length / totalChars * 100) : 0;
  let tip = `关键词出现次数：${count} 次\n总字符数：${totalChars}\n关键词密度：${density.toFixed(2)}%`;
  if(density<2){
    tip += "\n⚠️ 密度偏低，可以适当增加关键词";
  }else if(density>8){
    tip += "\n⚠️ 密度过高，容易判定关键词堆砌";
  }else{
    tip += "\n✅ 密度处于合理区间";
  }
  document.getElementById('densityResult').innerText = tip;
}
</script>
</body>
</html>
