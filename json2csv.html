<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON转CSV表格</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:260px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:8px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>JSON数组 转换 CSV 表格</h2>
<textarea id="jsonInput" placeholder="粘贴JSON数组"></textarea>
<button onclick="convertToCsv()">转为CSV预览</button>
<textarea id="csvOut" readonly></textarea>
<button onclick="downloadCsv()">下载CSV文件</button>
<script>
let csvStr = "";
function convertToCsv(){
  try{
    const data = JSON.parse(document.getElementById('jsonInput').value.trim());
    csvStr = Papa.unparse(data);
    document.getElementById('csvOut').value = csvStr;
  }catch(err){
    alert("JSON格式错误！");
  }
}
function downloadCsv(){
  if(!csvStr) return alert("先执行转换");
  const blob = new Blob([csvStr],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "export.csv";
  a.click();
}
</script>
</body>
</html>
