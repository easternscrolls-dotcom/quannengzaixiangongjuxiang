<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书抖音特殊装饰符号大全</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.group{margin-bottom:20px}
h4{margin-bottom:10px;color:#444}
.sym-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.sym{padding:10px;text-align:center;border:1px solid #eee;border-radius:6px;font-size:20px;cursor:pointer}
.sym:hover{background:#e8f0ff}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>抖音｜小红书 文案装饰特殊符号（点击一键复制）</h2>

<div class="group">
<h4>边框分隔符号</h4>
<div class="sym-grid">
<div class="sym" onclick="copy('︎︎✧')">✧</div>
<div class="sym" onclick="copy('✦')">✦</div>
<div class="sym" onclick="copy('⋆')">⋆</div>
<div class="sym" onclick="copy('❀')">❀</div>
<div class="sym" onclick="copy('✿')">✿</div>
<div class="sym" onclick="copy('☁︎')">☁︎</div>
<div class="sym" onclick="copy('⋆͛')">⋆͛</div>
<div class="sym" onclick="copy('˚̣̣')">˚̣̣</div>
</div>
</div>

<div class="group">
<h4>可爱括号装饰</h4>
<div class="sym-grid">
<div class="sym" onclick="copy('꒰')">꒰</div>
<div class="sym" onclick="copy('꒱')">꒱</div>
<div class="sym" onclick="copy('˚̣̣̣̣̩̩⸝⸝')">⸝⸝</div>
<div class="sym" onclick="copy('⊹')">⊹</div>
<div class="sym" onclick="copy('╭')">╭</div>
<div class="sym" onclick="copy('╮')">╮</div>
<div class="sym" onclick="copy('╰')">╰</div>
<div class="sym" onclick="copy('╯')">╯</div>
</div>
</div>

<div class="group">
<h4>波浪点缀符号</h4>
<div class="sym-grid">
<div class="sym" onclick="copy('︴')">︴</div>
<div class="sym" onclick="copy('﹏')">﹏</div>
<div class="sym" onclick="copy('〰')">〰</div>
<div class="sym" onclick="copy('≋')">≋</div>
<div class="sym" onclick="copy('⋈')">⋈</div>
<div class="sym" onclick="copy('✧')">✧</div>
<div class="sym" onclick="copy('✩')">✩</div>
<div class="sym" onclick="copy('☘')">☘</div>
</div>
</div>

<script>
function copy(s){
  navigator.clipboard.writeText(s);
}
</script>
</body>
</html>
