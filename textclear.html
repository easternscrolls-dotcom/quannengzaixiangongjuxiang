<h2>文本清理：去空行、多余空格、首尾空白</h2>
<textarea id="textClearInput"></textarea>
<div class="btn-row">
<button onclick="trimAll()">全部首尾去空格</button>
<button onclick="clearEmptyLine()">删除空行</button>
<button onclick="clearMultiSpace()">合并连续空格</button>
</div>
<textarea id="textClearOut" readonly></textarea>
<script>
function trimAll(){
  const t = document.getElementById('textClearInput').value;
  document.getElementById('textClearOut').value = t.trim();
}
function clearEmptyLine(){
  const t = document.getElementById('textClearInput').value;
  const lines = t.split(/\r?\n/).filter(s=>s.trim()!=='');
  document.getElementById('textClearOut').value = lines.join("\n");
}
function clearMultiSpace(){
  const t = document.getElementById('textClearInput').value;
  document.getElementById('textClearOut').value = t.replace(/\s+/g," ");
}
</script>

<script>
const cookieBox = document.getElementById('cookieBox');
const acceptBtn = document.getElementById('cookieAccept');
const rejectBtn = document.getElementById('cookieReject');
const cookieStatus = localStorage.getItem('cookieConsent');
if (!cookieStatus) {
    cookieBox.style.display = 'block';
}
acceptBtn.onclick = function(){
    localStorage.setItem('cookieConsent','accept');
    cookieBox.style.display = 'none';
};
rejectBtn.onclick = function(){
    localStorage.setItem('cookieConsent','reject');

};
</script>
