<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本清理 去除多余空格空行</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:220px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
.btn-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{padding:12px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>文本清理：去空行、多余空格、首尾空白</h2>
<textarea id="textClearInput"></textarea>
<div class="btn-row">
<button onclick="trimAll()">全部首尾去空格</button>
<button onclick="clearEmptyLine()">删除空行</button>
<button onclick="clearMultiSpace()">合并连续空格</button>
</div>
<textarea id="textClearOut" readonly></textarea>
<script>
function trimAll(){
  const t = document.getElementById('textClearInput').value;
  document.getElementById('textClearOut').value = t.trim();
}
function clearEmptyLine(){
  const t = document.getElementById('textClearInput').value;
  const lines = t.split(/\r?\n/).filter(s=>s.trim()!=='');
  document.getElementById('textClearOut').value = lines.join("\n");
}
function clearMultiSpace(){
  const t = document.getElementById('textClearInput').value;
  document.getElementById('textClearOut').value = t.replace(/\s+/g," ");
}
</script>
</body>
</html>
