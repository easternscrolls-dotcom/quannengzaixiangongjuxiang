<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频截取裁剪工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
input{padding:12px;border:1px solid #ddd;border-radius:6px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
audio{width:100%;margin:15px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>音频截取（自定义起止秒数裁剪片段）</h2>
<div class="upload-box">
<input type="file" accept="audio/*" id="audioFile">
</div>
<audio id="audioPreview" controls>
<div class="time-row">
<input id="cutStart" placeholder="起始秒，如 1.2">
<input id="cutEnd" placeholder="结束秒，如 15">
</div>
<button onclick="cutAudio()">截取导出MP3</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let audioBlob = null;
document.getElementById('audioFile').onchange = e=>{
  audioBlob = e.target.files[0];
  audioPreview.src = URL.createObjectURL(audioBlob);
}
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function cutAudio(){
  if(!audioBlob) return alert("上传音频文件");
  const s = cutStart.value.trim();
  const e = cutEnd.value.trim();
  if(!s||!e) return alert("填写起止时间");
  await loadFFmpeg();
  const buf = new Uint8Array(await audioBlob.arrayBuffer());
  ffmpeg.writeFile("in.mp3", buf);
  await ffmpeg.exec(["-ss",s,"-to",e,"-i","in.mp3","-c:a","libmp3lame","cut_out.mp3"]);
  const outBuf = ffmpeg.readFile("cut_out.mp3");
  const blob = new Blob([outBuf],{type:"audio/mpeg"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "截取音频.mp3";
  a.click();
}
</script>
</body>
</html>
