<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分隔文本转CSV表格</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
textarea{width:100%;height:240px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>分隔文本（逗号/制表符/空格）生成CSV表格</h2>
<input id="sepInput" placeholder="分隔符，如 , 或 \t" value=",">
<textarea id="textInput" placeholder="粘贴原始多行文本"></textarea>
<button onclick="textToCsv()">生成CSV下载</button>
<script>
function textToCsv(){
  const sep = document.getElementById('sepInput').value;
  const txt = document.getElementById('textInput').value;
  const lines = txt.split(/\r?\n/).filter(s=>s.trim()!=='');
  const data = lines.map(line=>line.split(sep));
  const csv = Papa.unparse(data);
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "文本转表格.csv";
  a.click();
}
</script>
</body>
</html>
