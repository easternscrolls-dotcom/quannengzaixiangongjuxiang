<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量统一图片宽高尺寸</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
.size-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
#fileList{margin:10px 0;line-height:1.8}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>批量多张图片统一缩放宽高</h2>
<div class="upload-box">
<input type="file" accept="image/*" multiple id="batchImg">
<p style="margin-top:8px;color:#666">多选图片批量处理</p>
</div>
<div class="size-row">
<input id="batchW" placeholder="统一宽度" value="750">
<input id="batchH" placeholder="统一高度" value="1000">
</div>
<div id="fileList"></div>
<button onclick="batchResizeImg()">批量缩放打包下载</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let fileArr = [];
document.getElementById('batchImg').onchange = e=>{
  fileArr = Array.from(e.target.files);
  let html = "待处理图片：<br/>";
  fileArr.forEach((f,i)=>html += `${i+1}. ${f.name}<br/>`);
  fileList.innerHTML = html;
}
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function batchResizeImg(){
  if(fileArr.length === 0) return alert("选择图片文件");
  const w = batchW.value;
  const h = batchH.value;
  await loadFFmpeg();
  const zip = new JSZip();
  for(let i=0;i<fileArr.length;i++){
    const f = fileArr[i];
    const buf = new Uint8Array(await f.arrayBuffer());
    ffmpeg.writeFile(`src${i}.png`, buf);
    await ffmpeg.exec(["-i",`src${i}.png`,"-vf",`scale=${w}:${h}`,`out${i}.png`]);
    const data = ffmpeg.readFile(`out${i}.png`);
    const saveName = f.name.replace(/\.\w+$/,"_统一尺寸.png");
    zip.file(saveName, data);
  }
  const zipBuf = await zip.generateAsync({type:"uint8array"});
  const blob = new Blob([zipBuf],{type:"application/zip"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "批量统一尺寸图片.zip";
  a.click();
}
</script>

<!-- Cookie弹窗开始 -->
<div id="cookieBox" style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:16px 24px;z-index:9999;display:none;">
    <div style="max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:16px;">
        <div style="flex:1;min-width:300px;">
            <p style="margin:0 0 6px 0;font-size:14px;color:#333;">🍪 Cookie 使用提示</p>
            <p style="margin:0;font-size:13px;color:#666;">
                本站使用Cookie优化访问体验，并投放Google联盟广告。继续使用网站即代表您同意我们的Cookie政策，您可查看<a href="/privacy.html" style="color:#0066cc;">隐私政策</a>。
            </p>
        </div>
        <div style="display:flex;gap:10px;">
            <button id="cookieAccept" style="padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;">同意</button>
            <button id="cookieReject" style="padding:8px 18px;background:#eee;color:#333;border:none;border-radius:6px;cursor:pointer;">拒绝</button>
        </div>
    </div>
</div>

<script>
const cookieBox = document.getElementById('cookieBox');
const acceptBtn = document.getElementById('cookieAccept');
const rejectBtn = document.getElementById('cookieReject');
const cookieStatus = localStorage.getItem('cookieConsent');
if (!cookieStatus) {
    cookieBox.style.display = 'block';
}
acceptBtn.onclick = function(){
    localStorage.setItem('cookieConsent','accept');
    cookieBox.style.display = 'none';
};
rejectBtn.onclick = function(){
    localStorage.setItem('cookieConsent','reject');
    cookieBox.style.display = 'none';
};
</script>
<!-- Cookie弹窗结束 -->
