<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频局部马赛克模糊打码</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
.grid-input{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>视频指定区域马赛克模糊打码</h2>
<div class="upload-box">
<input type="file" accept="video/*" id="videoFile">
</div>
<div class="grid-input">
<input id="blurX" placeholder="区域X起点">
<input id="blurY" placeholder="区域Y起点">
<input id="blurW" placeholder="模糊宽度">
<input id="blurH" placeholder="模糊高度">
</div>
<button onclick="blurVideo()">添加马赛克导出</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let vidBlob = null;
document.getElementById('videoFile').onchange = e=>vidBlob = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function blurVideo(){
  if(!vidBlob) return alert("上传视频");
  const x = blurX.value;
  const y = blurY.value;
  const w = blurW.value;
  const h = blurH.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await vidBlob.arrayBuffer());
  ffmpeg.writeFile("in.mp4", buf);
  const filter = `boxblur=20:enable='between(t,0,999),x=${x}:y=${y}:w=${w}:h=${h}'`;
  await ffmpeg.exec(["-i","in.mp4","-vf",filter,"blur_out.mp4"]);
  const outBuf = ffmpeg.readFile("blur_out.mp4");
  const blob = new Blob([outBuf],{type:"video/mp4"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "打码视频.mp4";
  a.click();
}
</script>
</body>
</html>
