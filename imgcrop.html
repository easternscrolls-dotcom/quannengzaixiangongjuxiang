<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片自定义裁剪工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
.crop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>图片坐标裁剪（宽/高/X起点/Y起点）</h2>
<div class="upload-box">
<input type="file" accept="image/*" id="imgFile">
</div>
<div class="crop-grid">
<input id="cropW" placeholder="裁剪宽度">
<input id="cropH" placeholder="裁剪高度">
<input id="cropX" placeholder="起始X坐标">
<input id="cropY" placeholder="起始Y坐标">
</div>
<button onclick="cropImg()">裁剪导出图片</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let imgFile = null;
document.getElementById('imgFile').onchange = e=>imgFile = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function cropImg(){
  if(!imgFile) return alert("上传图片");
  const w = cropW.value,h=cropH.value,x=cropX.value,y=cropY.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await imgFile.arrayBuffer());
  ffmpeg.writeFile("src.png", buf);
  await ffmpeg.exec(["-i","src.png","-vf",`crop=${w}:${h}:${x}:${y}`,"crop_out.png"]);
  const outBuf = ffmpeg.readFile("crop_out.png");
  const blob = new Blob([outBuf],{type:"image/png"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "裁剪图片.png";
  a.click();
}
</script>
</body>
</html>
