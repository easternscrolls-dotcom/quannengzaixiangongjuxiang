<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片等分切片分割工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
.slice-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>图片横向/纵向等分切片打包下载</h2>
<div class="upload-box">
<input type="file" accept="image/*" id="imgFile">
</div>
<div class="slice-row">
<input id="sliceX" placeholder="横向分割份数" value="3">
<input id="sliceY" placeholder="纵向分割份数" value="3">
</div>
<button onclick="sliceImage()">分割切片打包</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let sourceImg = null;
document.getElementById('imgFile').onchange = e=>sourceImg = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function sliceImage(){
  if(!sourceImg) return alert("上传图片");
  const x = Number(sliceX.value);
  const y = Number(sliceY.value);
  await loadFFmpeg();
  const buf = new Uint8Array(await sourceImg.arrayBuffer());
  ffmpeg.writeFile("src.png", buf);
  await ffmpeg.exec(["-i","src.png","-vf",`tile=${x}x${y}`,"all_slices.png"]);
  const zip = new JSZip();
  const full = ffmpeg.readFile("all_slices.png");
  zip.file("完整拼接图.png", full);
  const blob = new Blob([await zip.generateAsync({type:"uint8array"})],{type:"application/zip"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "图片切片包.zip";
  a.click();
}
</script>
</body>
</html>
