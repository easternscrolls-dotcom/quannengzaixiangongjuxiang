<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机姓名地址测试数据生成</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
<input id="nameAddrCount" placeholder="生成条数" type="number" value="10" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace">
<button onclick="genNameAddr()" style="width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer">生成姓名地址数据</button>
<textarea id="nameAddrOut" readonly style="width:100%;height:220px;padding:12px;border:1px solid #ddd;border-radius:6px;font-family:monospace"></textarea>
<p style="color:#999">⚠️仅开发测试模拟数据，非真实信息</p>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>随机姓名+地址测试数据生成</h2>
<input id="nameAddrCount" placeholder="生成条数" type="number" value="10">
<button onclick="genNameAddr()">生成姓名地址数据</button>
<textarea id="nameAddrOut" readonly></textarea>
<p style="color:#999">⚠️仅开发测试模拟数据，非真实信息</p>
<script>
const surname = ["张","李","王","刘","陈","杨","黄","赵","周","吴","徐","孙","马","朱","胡","郭"];
const nameWord = ["伟","芳","娜","强","磊","敏","静","杰","娟","涛","明","丽","超","宇","欣","浩"];
const city = ["北京市","上海市","广州市","深圳市","杭州市","成都市","武汉市","西安市","南京市","重庆市"];
const street = ["幸福路","和平大街","建设南路","科技大道","阳光小区","丽景花园","新城街道"];
function randItem(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}
function genNameAddr(){
    const count = parseInt(document.getElementById('nameAddrCount').value);
    const res = [];
    for(let i=0;i<count;i++){
        const name = randItem(surname)+randItem(nameWord)+(Math.random()>0.5 ? randItem(nameWord):"");
        const addr = randItem(city)+randItem(street)+Math.floor(Math.random()*200)+"号";
        res.push(`姓名：${name}，地址：${addr}`);
    }
    document.getElementById('nameAddrOut').value = res.join("\n");
}
</script>
</body>
</html>
