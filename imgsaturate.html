<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片饱和度对比度亮度调节</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
.three-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input{padding:10px;border:1px solid #ddd;border-radius:6px;margin:6px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>调整图片亮度、对比度、饱和度</h2>
<div class="upload-box">
<input type="file" accept="image/*" id="imgFile">
</div>
<div class="three-row">
<input id="bright" placeholder="亮度 -0.5~0.5" value="0">
<input id="contrast" placeholder="对比度 0~2" value="1">
<input id="satur" placeholder="饱和度 0~3" value="1.2">
</div>
<button onclick="adjustImgColor()">调色导出图片</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let sourceImg = null;
document.getElementById('imgFile').onchange = e=>sourceImg = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function adjustImgColor(){
  if(!sourceImg) return alert("上传图片");
  const br = bright.value;
  const ct = contrast.value;
  const st = satur.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await sourceImg.arrayBuffer());
  ffmpeg.writeFile("src.png", buf);
  const filter = `eq=brightness=${br}:contrast=${ct}:saturation=${st}`;
  await ffmpeg.exec(["-i","src.png","-vf",filter,"color_out.png"]);
  const outBuf = ffmpeg.readFile("color_out.png");
  const blob = new Blob([outBuf],{type:"image/png"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "调色图片.png";
  a.click();
}
</script>
</body>
</html>
