<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>两段文本差异对比</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
textarea{width:100%;height:220px;padding:12px;border:1px solid #ddd;border-radius:6px;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:12px 0}
#diffResult{padding:12px;border:1px solid #ddd;border-radius:6px;white-space:pre-wrap;line-height:1.6}
.del{background:#ffd6d6;color:#c00}
.add{background:#d6ffd6;color:#080}
</style>
<script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>两段文本差异高亮对比</h2>
<div class="row">
<textarea id="textOld" placeholder="原始文本"></textarea>
<textarea id="textNew" placeholder="新文本"></textarea>
</div>
<button onclick="diffText()">开始对比差异</button>
<div id="diffResult"></div>
<script>
function diffText(){
  const oldTxt = document.getElementById('textOld').value;
  const newTxt = document.getElementById('textNew').value;
  const diffArr = Diff.diffLines(oldTxt,newTxt);
  let html = "";
  diffArr.forEach(part=>{
    const txt = part.value.replace(/\n/g,"<br/>");
    if(part.removed){
      html += `<span class="del">${txt}</span>`;
    }else if(part.added){
      html += `<span class="add">${txt}</span>`;
    }else{
      html += txt;
    }
  })
  document.getElementById('diffResult').innerHTML = html;
}
</script>
</body>
</html>
