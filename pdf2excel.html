<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF表格提取导出Excel XLSX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
textarea{width:100%;height:200px;border:1px solid #ddd;border-radius:6px;padding:12px;margin:10px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>PDF表格提取转Excel</h2>
<div class="upload-box">
<input type="file" accept=".pdf" id="pdfFile">
</div>
<textarea id="tablePreview" readonly placeholder="提取文本预览"></textarea>
<button onclick="pdfToExcel()">导出XLSX表格</button>
<script>
const pdfjsLib = window.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js";
let tableData = [];
document.getElementById('pdfFile').onchange = async e=>{
  const f = e.target.files[0];
  const buf = await f.arrayBuffer();
  const pdf = await pdfjsLib.getDocument(buf).promise;
  tableData = [];
  let textAll = "";
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const textObj = await page.getTextContent();
    const lines = textObj.items.map(item=>item.str);
    tableData.push(lines);
    textAll += lines.join("\t")+"\n";
  }
  document.getElementById('tablePreview').value = textAll;
}
function pdfToExcel(){
  if(tableData.length===0) return alert("先上传PDF文件");
  const sheet = XLSX.utils.aoa_to_sheet(tableData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet, "PDF表格");
  XLSX.writeFile(wb, "PDF表格.xlsx");
}
</script>
</body>
</html>
