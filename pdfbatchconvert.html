<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量Word/图片/Excel一键转PDF</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
p.tip{color:#666;margin-top:10px}
</style>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.4.21/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>批量多文件转PDF（图片/docx/xlsx）</h2>
<p class="tip">多选多个图片、Word、Excel文件，批量分别生成PDF</p>
<div class="upload-box">
<input type="file" accept=".docx,.xlsx,.jpg,.png,.jpeg,.webp" multiple id="batchFile">
</div>
<button onclick="batchConvertPdf()">批量转换下载</button>
<script>
const { jsPDF } = window.jspdf;
async function batchConvertPdf(){
  const files = Array.from(document.getElementById('batchFile').files);
  if(files.length===0) return alert("选择待转换文件");
  for(let f of files){
    const name = f.name.toLowerCase();
    const buf = await f.arrayBuffer();
    const doc = new jsPDF();
    if(name.endsWith(".docx")){
      const res = await mammoth.extractRawText({arrayBuffer:buf});
      doc.setFont("simhei");
      doc.text(res.value,12,15,{maxWidth:180});
    }else if(name.endsWith(".xlsx")){
      const wb = XLSX.read(buf);
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(sheet,{header:1});
      doc.setFont("simhei");
      doc.text(data.map(r=>r.join("\t")).join("\n"),10,12);
    }else{
      const url = URL.createObjectURL(f);
      doc.addImage(url,0,0,210,297);
    }
    const saveName = f.name.replace(/\.\w+$/,".pdf");
    doc.save(saveName);
  }
}
</script>
</body>
</html>
