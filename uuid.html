<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID批量生成工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
textarea{width:100%;height:260px;padding:12px;border:1px solid #ddd;border-radius:6px;margin-top:10px;font-family:monospace}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>批量生成 UUID v4</h2>
<input id="uuidCount" placeholder="生成数量" value="10">
<button onclick="genUUID()">生成UUID列表</button>
<textarea id="uuidResult" readonly></textarea>
<script>
function uuidv4(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r = Math.random()*16|0;
    const v = c==='x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
function genUUID(){
  const count = parseInt(document.getElementById('uuidCount').value)||1;
  const arr = [];
  for(let i=0;i<count;i++) arr.push(uuidv4());
  document.getElementById('uuidResult').value = arr.join("\n");
}
</script>
</body>
</html>
