<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片格式转换工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>图片格式互转 JPG PNG WebP GIF BMP</h2>
<div class="upload-box">
<input type="file" accept="image/*" id="imgFile">
</div>
<select id="fmtSel">
<option value="jpg">转为 JPG</option>
<option value="png">转为 PNG</option>
<option value="webp">转为 WebP</option>
<option value="bmp">转为 BMP</option>
<option value="gif">转为 GIF</option>
</select>
<button onclick="convertImg()">执行格式转换</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let imgFile = null;
document.getElementById('imgFile').onchange = e=>imgFile = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function convertImg(){
  if(!imgFile) return alert("上传图片");
  const fmt = fmtSel.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await imgFile.arrayBuffer());
  ffmpeg.writeFile("source", buf);
  await ffmpeg.exec(["-i","source",`out.${fmt}`]);
  const outBuf = ffmpeg.readFile(`out.${fmt}`);
  let mime = "image/"+fmt;
  if(fmt === "jpg") mime = "image/jpeg";
  const blob = new Blob([outBuf], {type:mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `转换图片.${fmt}`;
  a.click();
}
</script>
</body>
</html>
