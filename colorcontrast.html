<h2>WCAG文字对比度检测（SEO+无障碍优化）</h2>
<div class="row">
<input id="fgColor" placeholder="文字色 #000000" value="#000000">
<input id="bgColor" placeholder="背景色 #ffffff" value="#ffffff">
</div>
<button onclick="calcContrast()">计算对比度</button>
<div id="preview">预览文字 Text ABC 123</div>
<div id="contrastResult"></div>
<script>
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}
function getLuminance(r,g,b){
  const a = [r,g,b].map(v=>{
    v /=255;
    return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);
  });
  return a[0]*0.2126 + a[1]*0.7152 + a[2]*0.0722;
}
function calcContrast(){
  const fg = document.getElementById('fgColor').value;
  const bg = document.getElementById('bgColor').value;
  const [fr,fg,fb] = hexToRgb(fg);
  const [br,bg,bb] = hexToRgb(bg);
  const L1 = getLuminance(fr,fg,fb);
  const L2 = getLuminance(br,bg,bb);
  const ratio = L1>L2 ? (L1+0.05)/(L2+0.05) : (L2+0.05)/(L1+0.05);
  document.getElementById('preview').style.color = fg;
  document.getElementById('preview').style.backgroundColor = bg;
  let tip = `对比度比值：${ratio.toFixed(2)}:1\n`;
  tip += "标准：普通文本 ≥4.5:1；大文本 ≥3:1\n";
  if(ratio >=4.5) tip += "✅ 通过无障碍标准";
  else tip += "❌ 对比度不足，不利于爬虫与阅读体验";
  document.getElementById('contrastResult').innerText = tip;
}
</script>

<script>

    cookieBox.style.display = 'block';
}

    cookieBox.style.display = 'none';
