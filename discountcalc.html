<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满减折扣价格计算器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 0}
#resultOut{padding:12px;border:1px solid #ddd;border-radius:6px;white-space:pre-line}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>满减/折扣双规则价格测算</h2>
<input id="originalPrice" placeholder="商品原价" step="0.01" type="number">
<input id="full" placeholder="满减门槛（0则无满减）" step="0.01" type="number" value="0">
<input id="reduce" placeholder="满减金额" step="0.01" type="number" value="0">
<input id="discountRate" placeholder="折扣（0~10，8=8折）" step="0.01" type="number" value="10">
<select id="order" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0">
<option value="discountFirst">先折扣，后满减</option>
<option value="fullFirst">先满减，后折扣</option>
</select>
<button onclick="calcFullDiscount()">计算到手价</button>
<div id="resultOut"></div>
<script>
function calcFullDiscount(){
    let price = parseFloat(document.getElementById('originalPrice').value);
    const full = parseFloat(document.getElementById('full').value);
    const reduce = parseFloat(document.getElementById('reduce').value);
    const discount = parseFloat(document.getElementById('discountRate').value)/10;
    const order = document.getElementById('order').value;
    let final;
    if(order === "discountFirst"){
        price = price * discount;
        if(price >= full) price -= reduce;
    }else{
        if(price >= full) price -= reduce;
        price = price * discount;
    }
    document.getElementById('resultOut').innerText = `活动最终售价：${price.toFixed(2)} 元`;
}
</script>
</body>
</html>
