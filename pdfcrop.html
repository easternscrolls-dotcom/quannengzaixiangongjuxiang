<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF页面裁剪去除白边工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
.crop-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
input{padding:12px;border:1px solid #ddd;border-radius:6px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin-top:10px}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>PDF页面裁剪（去除四周留白）</h2>
<div class="upload-box">
<input type="file" accept=".pdf" id="pdfFile">
</div>
<div class="crop-row">
<input id="cropLeft" placeholder="左边裁剪mm" value="10">
<input id="cropTop" placeholder="上边裁剪mm" value="10">
<input id="cropRight" placeholder="右边裁剪mm" value="10">
<input id="cropBottom" placeholder="下边裁剪mm" value="10">
</div>
<button onclick="cropPdf()">裁剪页面导出</button>
<script>
const { PDFDocument } = window.PDFLib;
async function cropPdf(){
  const file = document.getElementById('pdfFile').files[0];
  if(!file) return alert("上传PDF文件");
  const left = Number(cropLeft.value);
  const top = Number(cropTop.value);
  const right = Number(cropRight.value);
  const bottom = Number(cropBottom.value);
  const buf = await file.arrayBuffer();
  const pdf = await PDFDocument.load(buf);
  const pages = pdf.getPages();
  for(let page of pages){
    const { width, height } = page.getSize();
    page.setMediaBox(left, bottom, width-right, height-top);
  }
  const outBuf = await pdf.save();
  const blob = new Blob([outBuf],{type:"application/pdf"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "裁剪后文档.pdf";
  a.click();
}
</script>
</body>
</html>
