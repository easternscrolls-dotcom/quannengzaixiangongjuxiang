<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字倒序翻转工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:220px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px;background:#2478f5;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>文本翻转：整行字符倒序 / 行顺序反转</h2>
<textarea id="revInput"></textarea>
<div class="btn-row">
<button onclick="reverseChars()">每行字符倒序</button>
<button onclick="reverseLines()">整体行顺序反转</button>
</div>
<textarea id="revOutput" readonly></textarea>
<script>
function reverseChars(){
  const lines = document.getElementById('revInput').value.split(/\r?\n/);
  const res = lines.map(line=>[...line].reverse().join(""));
  document.getElementById('revOutput').value = res.join("\n");
}
function reverseLines(){
  const lines = document.getElementById('revInput').value.split(/\r?\n/);
  document.getElementById('revOutput').value = lines.reverse().join("\n");
}
</script>
</body>
</html>
