<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV编码转换 UTF8 ↔ GBK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/iconv-lite@0.6.3/lib/iconv-lite.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>CSV 文件编码转换（解决中文乱码）</h2>
<div class="upload-box">
<input type="file" accept=".csv" id="csvFile">
</div>
<select id="targetEncoding">
<option value="utf8">转为 UTF-8</option>
<option value="gbk">转为 GBK</option>
</select>
<button onclick="convertCsvEncoding()">转换编码下载</button>
<script>
document.getElementById('csvFile').onchange = e=>window.csvFileObj = e.target.files[0];
async function convertCsvEncoding(){
  if(!window.csvFileObj) return alert("上传CSV文件");
  const target = document.getElementById('targetEncoding').value;
  const buf = new Uint8Array(await window.csvFileObj.arrayBuffer());
  let text;
  try{
    text = iconv.decode(buf,"gbk");
  }catch{
    text = iconv.decode(buf,"utf8");
  }
  const outBuf = iconv.encode(text,target);
  const blob = new Blob([outBuf],{type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = target+"_表格.csv";
  a.click();
}
</script>
</body>
</html>
