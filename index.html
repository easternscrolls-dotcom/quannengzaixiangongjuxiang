let allTools = [];
let currentCatId = "all";

// 预加载工具
toolData.forEach(cat=>{
    cat.tools.forEach(t=>{
        if(typeof t !== "object") return;
        t.catId = cat.catId;
        t.catName = cat.catName;
        t.catIcon = cat.icon;
        allTools.push(t);
    })
})

// 渲染侧边分类
function renderSidebarCat(){
    const wrap = document.getElementById("sidebarCatList");
    wrap.innerHTML = "";
    toolData.forEach(cat=>{
        const div = document.createElement("div");
        div.className = "item";
        div.dataset.catid = cat.catId;
        div.innerHTML = `<span>${cat.icon}</span><span>${cat.catName}</span><span class="cat-num">${cat.tools.length}</span>`;
        wrap.appendChild(div);
    })
    document.querySelector('#sidebarAllMenu .item .cat-num').innerText = allTools.length;
    document.getElementById("totalToolNum").innerText = allTools.length;
}

// 侧边栏统一事件委托
document.querySelector('.sidebar').addEventListener('click', function(e){
    const item = e.target.closest('.item');
    if(!item) return;
    const cid = item.dataset.catid;
    switchCat(cid);
});

// 分组视图「仅看该类」跳转
document.getElementById('toolGrid').addEventListener('click', function(e){
    const jump = e.target.closest('.cat-group-jump');
    if(!jump) return;
    switchCat(jump.dataset.catid);
    window.scrollTo({top:0,behavior:'smooth'});
});

// 切换分类（修复targetCat缺失.catName）
function switchCat(catId){
    currentCatId = catId;
    document.querySelectorAll('.sidebar-menu .item').forEach(i=>i.classList.remove("active"));
    const activeDom = document.querySelector(`.sidebar-menu .item[data-catid="${catId}"]`);
    if(activeDom) activeDom.classList.add("active");

    if(catId === "all"){
        document.getElementById("currentCatName").innerText = "全部工具";
        document.getElementById("showCatCount").innerText = `${allTools.length} 个工具`;
        renderGrouped();
        return;
    }

    let showList = [];
    let catTitle = "全部工具";
    if(catId === "all"){
        showList = [...allTools];
    }else{
        const targetCat = toolData.find(c=>c.catId === catId);
        if(targetCat){
            catTitle = targetCat.catName;
            showList = targetCat.tools.filter(item=>typeof item === "object");
        }else{
            showList = [...allTools];
        }
    }
    document.getElementById("currentCatName").innerText = catTitle;
    document.getElementById("showCatCount").innerText = `${showList.length} 个工具`;
    renderTools(showList);
}

// 生成单张卡片
function makeCard(tool){
    const a = document.createElement("a");
    a.className = "tool-card";
    a.href = tool.page;
    a.innerHTML = `
            <div class="tool-icon">${tool.icon}</div>
            <div class="tool-info">
                <div class="tool-name">${tool.name}</div>
                <div class="tool-desc">${tool.desc}</div>
            </div>
        `;
    return a;
}

// 渲染卡片（平铺，用于单分类/搜索）
function renderTools(list){
    const grid = document.getElementById("toolGrid");
    grid.className = "tool-grid";
    grid.innerHTML = "";
    if(list.length === 0){
        grid.innerHTML = "<p style='grid-column:1/-1;text-align:center;padding:60px;color:#999'>暂无匹配工具，请更换关键词</p>";
        return;
    }
    list.forEach(tool=>grid.appendChild(makeCard(tool)));
}

// 渲染分组折叠（用于「全部工具」视图，每类默认前N个，其余点击懒加载）
const GROUP_PREVIEW = 10;
function renderGrouped(){
    const grid = document.getElementById("toolGrid");
    grid.className = "cat-groups";
    grid.innerHTML = "";
    toolData.forEach(cat=>{
        const tools = cat.tools.filter(t=>typeof t === "object");
        if(!tools.length) return;
        const sec = document.createElement("div");
        sec.className = "cat-group";
        const head = document.createElement("div");
        head.className = "cat-group-head";
        head.innerHTML = `<span class="cat-group-title"><span>${cat.icon}</span> ${cat.catName}</span><span class="cat-group-count">${tools.length}</span><a class="cat-group-jump" data-catid="${cat.catId}">仅看该类 →</a>`;
        sec.appendChild(head);
        const g = document.createElement("div");
        g.className = "tool-grid";
        tools.slice(0, GROUP_PREVIEW).forEach(t=>g.appendChild(makeCard(t)));
        sec.appendChild(g);
        const rest = tools.slice(GROUP_PREVIEW);
        if(rest.length){
            const btn = document.createElement("button");
            btn.className = "expand-btn";
            btn.textContent = `展开全部 ${tools.length} 个 ↓`;
            btn.onclick = ()=>{
                rest.forEach(t=>g.appendChild(makeCard(t)));
                btn.remove();
            };
            sec.appendChild(btn);
        }
        grid.appendChild(sec);
    });
}

// 搜索函数（修复source → sourceList）
let searchTimer = null;
document.getElementById("searchInput").oninput = ()=>{
    clearTimeout(searchTimer);
    searchTimer = setTimeout(searchFilter, 200);
}
function searchFilter(){
    const kw = document.getElementById("searchInput").value.trim().toLowerCase();
    if(!kw){
        switchCat(currentCatId);
        return;
    }
    let sourceList = currentCatId === "all" ? allTools : allTools.filter(t=>t.catId === currentCatId);
    const result = sourceList.filter(t=> t.name.toLowerCase().includes(kw) || t.desc.toLowerCase().includes(kw));
    document.getElementById("showCatCount").innerText = `搜索结果：${result.length} 个`;
    renderTools(result);
}

// 深色切换
function toggleDark(){
    document.documentElement.classList.toggle("dark");
}

// 回到顶部
window.onscroll = ()=>{
    const btn = document.getElementById("backTopBtn");
    btn.style.display = window.scrollY > 400 ? "block" : "none";
}

// 初始化
window.onload = ()=>{
    renderSidebarCat();
    switchCat("all");
}
