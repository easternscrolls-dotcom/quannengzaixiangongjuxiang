body{background:var(--page);color:var(--text-main);height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:0.3s;}

/* 顶部导航栏 */
.top-bar{
    height:64px;
    background:var(--card-bg);
    border-bottom:1px solid var(--border);

    align-items:center;
    padding:0 24px;

.top-bar .logo{

    width:180px;
    color:var(--main-blue);
}
.search-wrap{
    flex:1;

}
#searchInput{
    width:100%;

    border:1px solid var(--border);
    border-radius:8px;
    padding:0 16px;
    font-size:14px;
    background:var(--card-bg);

#searchInput:focus{

.top-right{

.themeBtn{

.sidebar-menu .item{

    padding:10px 12px;
    border-radius:var(--radius);
    cursor:pointer;
    font-size:14px;
    margin-bottom:6px;
    gap:8px;
    transition:0.2s;
}
.sidebar-menu .item.active{
    background:var(--sidebar-bg);
    color:var(--primary);
    font-weight:500;
}
.sidebar-menu .item:hover:not(.active){
    background:var(--page-bg);
}
.sidebar .split{
    height:1px;
    background:var(--border);
    margin:18px 6px;
}
.item .cat-num{
    margin-left:auto;
    font-size:12px;
    color:var(--text-second);

.content-header{

.content-title h2{

.tool-count-tag{

    background:var(--sidebar-bg);
    color:var(--primary);
    border-radius:16px;
    font-size:13px;
}

.tool-grid{
    display:grid;
    grid-template-columns:repeat(10, minmax(140px, 1fr));
    gap:14px;
}
.tool-card{
    background:var(--card-bg);
    border-radius:var(--radius);
    padding:14px 12px;
    border:1px solid var(--border);
    cursor:pointer;
    transition:0.2s;
    display:flex;
    gap:10px;
    text-decoration:none;
    color:inherit;
    align-items:flex-start;
    min-width:140px;
}
.tool-card:hover{
    box-shadow:var(--shadow);
    border-color:var(--primary);
    transform:translateY(-2px);
}
.tool-icon{
    width:32px;
    height:32px;
    flex-shrink:0;
    border-radius:6px;
    background:var(--main-light);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    color:var(--main-blue);

.tool-info{
    flex:1;
    min-width: 0;
}
.tool-name{
    font-size:13px;

    line-height:1.4;
    white-space:nowrap;
    overflow:hidden;

.tool-desc{

    line-height:1.4;

    white-space:nowrap;
    overflow:hidden;

    right:28px;
    bottom:28px;
    width:46px;
    height:46px;
    border-radius:50%;

    color:#fff;
    border:none;
    font-size:20px;
    cursor:pointer;
    display:none;

    .tool-grid{grid-template-columns:repeat(8, minmax(140px, 1fr));}

@media (max-width:1440px){
    .tool-grid{grid-template-columns:repeat(6, minmax(140px, 1fr));}
}
@media (max-width:1200px){
    .tool-grid{grid-template-columns:repeat(5, minmax(140px, 1fr));}
}
@media (max-width:992px){
    .tool-grid{grid-template-columns:repeat(4, minmax(140px, 1fr));}
}
@media (max-width:768px){
    .sidebar{width:160px;}
    .tool-grid{grid-template-columns:repeat(3, minmax(140px, 1fr));}

@media (max-width:640px){

    .sidebar{width:100%;height:auto;border-right:none;border-bottom:1px solid var(--border);}

// 扁平化所有工具，统计总数230
let currentCatId = "all";
let allTools = [];
toolData.forEach(cat=>{
    cat.tools.forEach(t=>{
        t.catId = cat.catId;
        t.catName = cat.catName;
        allTools.push(t);
    })
})

// 渲染左侧分类菜单
function renderSidebarCat(){
    const wrap = document.getElementById("sidebarCatList");
    wrap.innerHTML = "";
    toolData.forEach(cat=>{
        const div = document.createElement("div");
        div.className = "item";
        div.dataset.catid = cat.catId;
        div.innerHTML = `<span>${cat.catIcon}</span><span>${cat.catName}</span><span class="cat-num">${cat.catTotal}</span>`;
        div.onclick = ()=>switchCat(cat.catId);
        wrap.appendChild(div);
    })
    document.querySelector('.sidebar-menu .item[data-catid="all"]').onclick = ()=>switchCat("all");
}

// 切换分类渲染对应工具
function switchCat(catId){
    currentCatId = catId;
    document.querySelectorAll('.sidebar-menu .item').forEach(i=>i.classList.remove("active"));
    document.querySelector(`.sidebar-menu .item[data-catid="${catId}"]`).classList.add("active");
    const titleDom = document.getElementById("currentCatName");
    const countDom = document.getElementById("showCatCount");
    let list;
    if(catId === "all"){
        titleDom.innerText = "全部工具";
        list = allTools;
    }else{
        const c = toolData.find(x=>x.catId == catId);
        titleDom.innerText = c.catName;
        list = c.tools;
    }
    countDom.innerText = `${list.length} 个工具`;
    renderTools(list);
}

// 渲染工具卡片
function renderTools(list){
    const grid = document.getElementById("toolGrid");
    grid.innerHTML = "";
    list.forEach(tool=>{
        const a = document.createElement("a");
        a.className = "tool-card";
        a.href = tool.href;
        a.title = tool.desc;
        a.innerHTML = `
            <div class="tool-icon">${tool.icon}</div>
            <div class="tool-info">
                <div class="tool-name">${tool.name}</div>
                <div class="tool-desc">${tool.desc}</div>
            </div>
        `;
        grid.appendChild(a);
    })
}

// 搜索过滤
let searchTimer = null;
document.getElementById("searchInput").oninput = ()=>{
    clearTimeout(searchTimer);
    searchTimer = setTimeout(searchFilter, 200);
}
function searchFilter(){
    const kw = document.getElementById("searchInput").value.trim().toLowerCase();
    if(!kw) return switchCat(currentCatId);
    const source = currentCatId === "all" ? allTools : toolData.find(c=>c.catId==currentCatId).tools;
    const res = source.filter(t=>t.name.toLowerCase().includes(kw) || t.desc.toLowerCase().includes(kw));
    document.getElementById("showCatCount").innerText = `搜索结果：${res.length} 个`;
    renderTools(res);
}

function toggleDark(){
    document.documentElement.classList.toggle("dark");
}

window.onscroll = ()=>{
    const btn = document.getElementById("backTopBtn");
    btn.style.display = window.scrollY > 400 ? "block" : "none";
}

window.onload = ()=>{
    renderSidebarCat();
    switchCat("all");
    console.log("总工具数：", allTools.length);
}
