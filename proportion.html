<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>比例换算计算器 a:b=c:x</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input{padding:12px;border:1px solid #ddd;border-radius:6px;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 0}
<input id="propOut" readonly>
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>比例换算 a : b = c : x</h2>
<div class="row">
<input id="pa" placeholder="a">
<input id="pb" placeholder="b">
<input id="pc" placeholder="c">
</div>
<button onclick="calcProportion()">求未知数x</button>
<input id="propOut" readonly placeholder="结果 x">
<script>
function calcProportion(){
    const a = parseFloat(document.getElementById('pa').value);
    const b = parseFloat(document.getElementById('pb').value);
    const c = parseFloat(document.getElementById('pc').value);
    if(isNaN(a)||isNaN(b)||isNaN(c)||b===0){alert("分母不能为0，请输入有效数字");return;}
    const x = c*b/a;
    document.getElementById('propOut').value = x.toFixed(6);
}
</script>
</body>
</html>
