<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本编码 GBK UTF8 转换</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:220px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px;background:#2478f5;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/iconv-lite@0.6.3/lib/iconv-lite.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>文本 UTF8 ↔ GBK 编码转换（二进制串）</h2>
<textarea id="charInput" placeholder="输入文本"></textarea>
<div class="btn-row">
<button onclick="toGBK()">文本转GBK十六进制</button>
<button onclick="toUTF8()">文本转UTF8十六进制</button>
</div>
<textarea id="charOutput" readonly></textarea>
<script>
function buf2hex(buf){
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join(" ").toUpperCase();
}
function toGBK(){
  const txt = document.getElementById('charInput').value;
  const buf = iconv.encode(txt,"gbk");
  document.getElementById('charOutput').value = buf2hex(buf);
}
function toUTF8(){
  const txt = document.getElementById('charInput').value;
  const buf = iconv.encode(txt,"utf8");
  document.getElementById('charOutput').value = buf2hex(buf);
}
</script>
</body>
</html>
