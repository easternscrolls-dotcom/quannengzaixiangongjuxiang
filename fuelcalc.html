<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汽车百公里油耗计算器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 0}
#resultOut{padding:12px;border:1px solid #ddd;border-radius:6px;white-space:pre-line}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>汽车百公里油耗计算器</h2>
<input id="fuelLiter" placeholder="加油升数(L)" type="number" step="0.01">
<input id="distance" placeholder="行驶里程(km)" type="number" step="0.1">
<input id="price" placeholder="油价（元/升）" type="number" step="0.01">
<button onclick="calcFuel()">计算油耗</button>
<div id="resultOut"></div>
<script>
function calcFuel(){
    const liter = parseFloat(document.getElementById('fuelLiter').value);
    const km = parseFloat(document.getElementById('distance').value);
    const oilPrice = parseFloat(document.getElementById('price').value);
    if(isNaN(liter)||isNaN(km)||km<=0){alert("请填写有效里程与油量");return;}
    const fuel100 = liter / km * 100;
    let cost100km = null;
    if(!isNaN(oilPrice)){
        cost100km = fuel100 * oilPrice;
    }
    let txt = `百公里油耗：${fuel100.toFixed(2)} L/100km`;
    if(cost100km !== null){
        txt += `\n百公里油费：${cost100km.toFixed(2)} 元`;
    }
    document.getElementById('resultOut').innerText = txt;
}
</script>
</body>
</html>
