<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF图片OCR文字识别 扫描件提取文字</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}

textarea{width:100%;height:320px;border:1px solid #ddd;border-radius:6px;padding:12px;font-size:15px}
p.tip{color:#e64340;margin:8px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.min.js"></script>

</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>PDF扫描件OCR文字识别</h2>
<p class="tip">仅适合图片型PDF扫描件，纯文字PDF请使用「PDF提取文字」工具</p>
<div class="upload-box">
<input type="file" accept=".pdf" id="pdfFile">
</div>
<button onclick="pdfOcr()">开始OCR识别（耗时较长，请等待）</button>
<textarea id="ocrResult" readonly placeholder="识别文字输出区域"></textarea>
<script>
const pdfjsLib = window.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js";
async function pdfOcr(){
  const file = document.getElementById('pdfFile').files[0];
  if(!file) return alert("上传PDF扫描件");
  const arrayBuf = await file.arrayBuffer();
  const pdfDoc = await pdfjsLib.getDocument(arrayBuf).promise;
  const page1 = await pdfDoc.getPage(1);
  const viewport = page1.getViewport({scale:1.4});
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = viewport.width;
  canvas.height = viewport.height;

  const imgData = canvas.toDataURL("image/png");
  const res = await Tesseract.recognize(imgData, 'chi_sim+eng');
  document.getElementById('ocrResult').value = res.data.text;
}
</script>
</body>
</html>
