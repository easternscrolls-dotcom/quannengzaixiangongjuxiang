<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频添加回声/混响效果</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>人声添加回声混响（K歌/空旷音效）</h2>
<div class="upload-box">
<input type="file" accept="audio/*" id="audioFile">
</div>
<input id="echoDelay" placeholder="回声延迟毫秒 200~600" value="350">
<button onclick="addEcho()">生成带回声音频</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let audFile = null;
document.getElementById('audioFile').onchange = e=>audFile = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function addEcho(){
  if(!audFile) return alert("上传音频");
  const delay = echoDelay.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await audFile.arrayBuffer());
  ffmpeg.writeFile("src.mp3", buf);
  await ffmpeg.exec(["-i","src.mp3","-af",`aecho=0.8:0.88:${delay}:0.4`,"echo_out.mp3"]);
  const outBuf = ffmpeg.readFile("echo_out.mp3");
  const blob = new Blob([outBuf],{type:"audio/mpeg"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "带回声音频.mp3";
  a.click();
}
</script>
</body>
</html>
