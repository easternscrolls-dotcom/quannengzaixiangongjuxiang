<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线视频截取裁剪工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
input{padding:12px;border:1px solid #ddd;border-radius:6px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
video{width:100%;margin:15px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>视频截取（自定义起止时间裁剪片段）</h2>
<div class="upload-box">
<input type="file" accept="video/*" id="videoFile">
</div>
<video id="previewVideo" controls></video>
<div class="time-row">
<input id="startTime" placeholder="起始秒数，如 2.5">
<input id="endTime" placeholder="结束秒数，如 10">
</div>
<button onclick="cutVideo()">截取片段导出MP4</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let videoBlob = null;
document.getElementById('videoFile').onchange = async e=>{
  const file = e.target.files[0];
  videoBlob = file;
  previewVideo.src = URL.createObjectURL(file);
}
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function cutVideo(){
  if(!videoBlob) return alert("上传视频文件");
  const start = startTime.value.trim();
  const end = endTime.value.trim();
  if(!start || !end) return alert("填写起止时间");
  await loadFFmpeg();
  const uint8 = new Uint8Array(await videoBlob.arrayBuffer());
  ffmpeg.writeFile("input.mp4", uint8);
  await ffmpeg.exec(["-ss", start, "-to", end, "-i", "input.mp4", "-c", "copy", "output.mp4"]);
  const outData = ffmpeg.readFile("output.mp4");
  const outBlob = new Blob([outData], {type:"video/mp4"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(outBlob);
  a.download = "截取片段.mp4";
  a.click();
}
</script>
</body>
</html>
