<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进制转换 2~36进制</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input,select{padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0;font-family:monospace}
button{width:100%;padding:12px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>2~36进制任意互转（二进制/八进制/十进制/十六进制）</h2>
<div class="row">
<input id="numInput" placeholder="输入数字">
<select id="baseFrom">
<option value="2">来源进制 2</option>
<option value="8">来源进制 8</option>
<option value="10" selected>来源进制 10</option>
<option value="16">来源进制 16</option>
<option value="36">来源进制 36</option>
</select>
<select id="baseTo">
<option value="2">目标进制 2</option>
<option value="8">目标进制 8</option>
<option value="10">目标进制 10</option>
<option value="16" selected>目标进制 16</option>
<option value="36">目标进制 36</option>
</select>
</div>
<button onclick="convertBase()">进制转换</button>
<input id="baseOutput" readonly>
<script>
function convertBase(){
  const val = document.getElementById('numInput').value.trim();
  const bFrom = parseInt(document.getElementById('baseFrom').value);
  const bTo = parseInt(document.getElementById('baseTo').value);
  try{
    const dec = parseInt(val,bFrom);
    if(isNaN(dec)) throw Error();
    document.getElementById('baseOutput').value = dec.toString(bTo).toUpperCase();
  }catch{
    alert("数字或进制不合法");
  }
}
</script>
</body>
</html>
