<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多格式音频转换工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>音频格式转换 MP3 WAV FLAC M4A</h2>
<div class="upload-box">
<input type="file" accept="audio/*" id="audioFile">
</div>
<select id="formatSel">
<option value="mp3">转为 MP3</option>
<option value="wav">转为 WAV</option>
<option value="flac">转为 FLAC无损</option>
<option value="m4a">转为 M4A</option>
</select>
<button onclick="convertAudio()">执行转换</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let audFile = null;
document.getElementById('audioFile').onchange = e=>audFile = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function convertAudio(){
  if(!audFile) return alert("上传音频");
  const fmt = formatSel.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await audFile.arrayBuffer());
  ffmpeg.writeFile("source", buf);
  let cmd = ["-i","source"];
  if(fmt === "mp3") cmd.push("-c:a","libmp3lame");
  if(fmt === "flac") cmd.push("-c:a","flac");
  cmd.push(`out.${fmt}`);
  await ffmpeg.exec(cmd);
  const outBuf = ffmpeg.readFile(`out.${fmt}`);
  let mime;
  if(fmt==="mp3") mime="audio/mpeg";
  else if(fmt==="wav") mime="audio/wav";
  else if(fmt==="flac") mime="audio/flac";
  else mime="audio/mp4";
  const blob = new Blob([outBuf], {type:mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `音频.${fmt}`;
  a.click();
}
</script>
</body>
</html>
