<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机端口生成工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
textarea{width:100%;height:200px;padding:12px;border:1px solid #ddd;border-radius:6px;margin-top:10px;font-family:monospace}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>随机生成可用端口（默认 1024~65535）</h2>
<div class="row">
<input id="portMin" placeholder="最小端口" value="1024">
<input id="portMax" placeholder="最大端口" value="65535">
</div>
<input id="portCount" placeholder="生成数量" value="10">
<button onclick="genRandomPort()">生成端口列表</button>
<textarea id="portResult" readonly></textarea>
<script>
function genRandomPort(){
  const min = parseInt(document.getElementById('portMin').value);
  const max = parseInt(document.getElementById('portMax').value);
  const count = parseInt(document.getElementById('portCount').value);
  if(min >= max || count <=0){
    alert("参数非法");
    return;
  }
  const result = new Set();
  while(result.size < count){
    const p = Math.floor(Math.random()*(max-min+1))+min;
    result.add(p);
  }
  document.getElementById('portResult').value = Array.from(result).sort((a,b)=>a-b).join("\n");
}
</script>
</body>
</html>
