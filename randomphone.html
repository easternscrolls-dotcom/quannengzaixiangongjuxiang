<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试手机号批量生成（仅开发测试）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
<input id="phoneCount" placeholder="生成数量" type="number" value="10" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace">
<button onclick="genTestPhone()" style="width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer">生成测试手机号</button>
<textarea id="phoneOut" readonly style="width:100%;height:200px;padding:12px;border:1px solid #ddd;border-radius:6px;font-family:monospace"></textarea>
<p style="color:#999;margin-top:8px">⚠️仅用于程序开发测试，不可用于短信骚扰、违规用途</p>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>批量生成测试手机号（仅开发调试使用）</h2>
<input id="phoneCount" placeholder="生成数量" type="number" value="10">
<button onclick="genTestPhone()">生成测试手机号</button>
<textarea id="phoneOut" readonly></textarea>
<p style="color:#999;margin-top:8px">⚠️仅用于程序开发测试，禁止用于短信骚扰等违规行为</p>
<script>
function randomDigit(){
    return Math.floor(Math.random()*10);
}
function genTestPhone(){
    const count = parseInt(document.getElementById('phoneCount').value);
    const start = ["130","131","132","135","136","137","138","139","150","151","152","155","156","158","159","182","183","188","198"];
    const res = [];
    for(let i=0;i<count;i++){
        const prefix = start[Math.floor(Math.random()*start.length)];
        let suffix = "";
        for(let k=0;k<8;k++) suffix += randomDigit();
        res.push(prefix+suffix);
    }
    document.getElementById('phoneOut').value = res.join("\n");
}
</script>
</body>
</html>
