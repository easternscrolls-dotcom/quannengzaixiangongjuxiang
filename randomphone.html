<script>
function randomDigit(){
    return Math.floor(Math.random()*10);
}
function genTestPhone(){
    const count = parseInt(document.getElementById('phoneCount').value);
    const start = ["130","131","132","135","136","137","138","139","150","151","152","155","156","158","159","182","183","188","198"];
    const res = [];
    for(let i=0;i<count;i++){
        const prefix = start[Math.floor(Math.random()*start.length)];
        let suffix = "";
        for(let k=0;k<8;k++) suffix += randomDigit();
        res.push(prefix+suffix);
    }
    document.getElementById('phoneOut').value = res.join("\n");
}
</script>
