<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL编码解码工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:180px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>URL 编码 / URL 解码</h2>
<textarea id="urlInput" placeholder="输入链接、中文参数"></textarea>
<div class="btn-row">
<button onclick="urlEncode()">URL编码</button>
<button onclick="urlDecode()">URL解码</button>
</div>
<textarea id="urlOutput" readonly></textarea>
<script>
function urlEncode(){
  document.getElementById('urlOutput').value = encodeURIComponent(document.getElementById('urlInput').value);
}
function urlDecode(){
  try{
    document.getElementById('urlOutput').value = decodeURIComponent(document.getElementById('urlInput').value);
  }catch(e){
    alert("解码失败，非合法URL编码");
  }
}
</script>
</body>
</html>
