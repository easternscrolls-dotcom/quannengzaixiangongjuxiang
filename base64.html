<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 编码解码</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:180px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>Base64 文本编码 / 解码</h2>
<textarea id="b64Input" placeholder="输入文本"></textarea>
<div class="btn-row">
<button onclick="toBase64()">编码Base64</button>
<button onclick="fromBase64()">解码Base64</button>
</div>
<textarea id="b64Output" readonly></textarea>
<script>
function toBase64(){
  const str = document.getElementById('b64Input').value;
  document.getElementById('b64Output').value = btoa(unescape(encodeURIComponent(str)));
}
function fromBase64(){
  try{
    const str = document.getElementById('b64Input').value;
    document.getElementById('b64Output').value = decodeURIComponent(escape(atob(str)));
  }catch(e){
    alert("Base64字符串非法");
  }
}
</script>
</body>
</html>
