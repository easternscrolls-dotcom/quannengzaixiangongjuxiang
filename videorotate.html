body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}

<body>
<h1 style="margin:16px 0;font-size:22px;">视频画面旋转工具</h1>

<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>视频画面顺时针旋转</h2>
<div class="upload-box">
<input type="file" accept="video/*" id="videoFile">
</div>
<select id="rotSel">
<option value="transpose=1">90度顺时针</option>
<option value="transpose=2,transpose=2">180度</option>
<option value="transpose=3">90度逆时针</option>
</select>
<button onclick="rotateVideo()">旋转导出视频</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let sourceVid = null;
document.getElementById('videoFile').onchange = e=>sourceVid = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function rotateVideo(){
  if(!sourceVid) return alert("上传视频");
  const filter = rotSel.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await sourceVid.arrayBuffer());
  ffmpeg.writeFile("src.mp4", buf);
  await ffmpeg.exec(["-i","src.mp4","-vf",filter,"rotate_out.mp4"]);
  const outBuf = ffmpeg.readFile("rotate_out.mp4");
  const blob = new Blob([outBuf],{type:"video/mp4"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "旋转视频.mp4";
  a.click();
}
</script>

    <div style="max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:16px;">

        </div>
        <div style="display:flex;gap:10px;">
            <button id="cookieAccept" style="padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;">同意</button>
            <button id="cookieReject" style="padding:8px 18px;background:#eee;color:#333;border:none;border-radius:6px;cursor:pointer;">拒绝</button>
        </div>
    </div>
</div>

<script>
const cookieBox = document.getElementById('cookieBox');
const acceptBtn = document.getElementById('cookieAccept');
const rejectBtn = document.getElementById('cookieReject');
const cookieStatus = localStorage.getItem('cookieConsent');
if (!cookieStatus) {
    cookieBox.style.display = 'block';
}
acceptBtn.onclick = function(){
    localStorage.setItem('cookieConsent','accept');
    cookieBox.style.display = 'none';
};
rejectBtn.onclick = function(){
    localStorage.setItem('cookieConsent','reject');
    cookieBox.style.display = 'none';
};
</script>
