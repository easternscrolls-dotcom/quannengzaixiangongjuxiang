<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频画面旋转工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>视频画面顺时针旋转</h2>
<div class="upload-box">
<input type="file" accept="video/*" id="videoFile">
</div>
<select id="rotSel">
<option value="transpose=1">90度顺时针</option>
<option value="transpose=2,transpose=2">180度</option>
<option value="transpose=3">90度逆时针</option>
</select>
<button onclick="rotateVideo()">旋转导出视频</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let sourceVid = null;
document.getElementById('videoFile').onchange = e=>sourceVid = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function rotateVideo(){
  if(!sourceVid) return alert("上传视频");
  const filter = rotSel.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await sourceVid.arrayBuffer());
  ffmpeg.writeFile("src.mp4", buf);
  await ffmpeg.exec(["-i","src.mp4","-vf",filter,"rotate_out.mp4"]);
  const outBuf = ffmpeg.readFile("rotate_out.mp4");
  const blob = new Blob([outBuf],{type:"video/mp4"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "旋转视频.mp4";
  a.click();
}
</script>
</body>
</html>
