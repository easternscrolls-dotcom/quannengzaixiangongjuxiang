<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空白画布生成截图底板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.size-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>生成指定尺寸空白画布（白底/黑底）</h2>
<div class="size-row">
<input id="canW" placeholder="画布宽度" value="1080">
<input id="canH" placeholder="画布高度" value="1920">
</div>
<input id="bgColor" placeholder="背景色 white / black" value="white">
<button onclick="createCanvas()">生成画布图片</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function createCanvas(){
  const w = canW.value;
  const h = canH.value;
  const bg = bgColor.value;
  await loadFFmpeg();
  await ffmpeg.exec(["-f","lavfi",`color=c=${bg}:size=${w}x${h}:duration=0.1`,"canvas.png"]);
  const outBuf = ffmpeg.readFile("canvas.png");
  const blob = new Blob([outBuf],{type:"image/png"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "空白画布.png";
  a.click();
}
</script>
</body>
</html>
