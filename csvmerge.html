<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多个CSV文件合并</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
#fileList{margin:12px 0;line-height:1.8}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>多选多个CSV文件合并（同结构表格）</h2>
<div class="upload-box">
<input type="file" accept=".csv" multiple id="csvInput">
</div>
<div id="fileList"></div>
<button onclick="mergeCsv()">合并并下载CSV</button>
<script>
let fileList = [];
document.getElementById('csvInput').onchange = e=>{
  fileList = Array.from(e.target.files);
  let html = "已选择文件：<br/>";
  fileList.forEach((f,i)=>html += `${i+1}. ${f.name}<br/>`);
  document.getElementById('fileList').innerHTML = html;
}
async function mergeCsv(){
  if(fileList.length<2) return alert("至少选择2个CSV");
  let allData = [];
  let headerReady = false;
  let headers = [];
  for(let f of fileList){
    const text = await f.text();
    const res = Papa.parse(text,{header:true,skipEmptyLines:true});
    if(!headerReady){
      headers = res.meta.fields;
      headerReady = true;
    }
    allData = allData.concat(res.data);
  }
  const csvText = Papa.unparse({fields:headers,data:allData});
  const blob = new Blob([csvText],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "合并表格.csv";
  a.click();
}
</script>
</body>
</html>
