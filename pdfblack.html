<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF局部涂黑遮挡隐私内容</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
.grid-input{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>PDF隐私内容涂黑遮挡</h2>
<div class="upload-box">
<input type="file" accept=".pdf" id="pdfFile">
</div>
<div class="grid-input">
<input id="maskX" placeholder="遮挡区域X坐标">
<input id="maskY" placeholder="遮挡区域Y坐标">
<input id="maskW" placeholder="遮挡宽度">
<input id="maskH" placeholder="遮挡高度">
</div>
<input id="maskPage" placeholder="需要遮挡的页码" value="1">
<button onclick="addBlackMask()">添加黑色遮挡块</button>
<script>
const { PDFDocument, rgb } = window.PDFLib;
async function addBlackMask(){
  const file = document.getElementById('pdfFile').files[0];
  if(!file) return alert("上传PDF");
  const x = Number(maskX.value);
  const y = Number(maskY.value);
  const w = Number(maskW.value);
  const h = Number(maskH.value);
  const pageIdx = Number(maskPage.value)-1;
  const buf = await file.arrayBuffer();
  const pdf = await PDFDocument.load(buf);
  const page = pdf.getPage(pageIdx);
  page.drawRectangle({x,y,width:w,height:h,color:rgb(0,0,0)});
  const outBuf = await pdf.save();
  const blob = new Blob([outBuf],{type:"application/pdf"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "隐私遮挡文档.pdf";
  a.click();
}
</script>
</body>
</html>
