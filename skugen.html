<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量SKU编码生成器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 0}
textarea{width:100%;height:220px;padding:12px;border:1px solid #ddd;border-radius:6px;font-family:monospace}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>批量SKU编码生成｜前缀+序号</h2>
<input id="prefix" placeholder="SKU前缀，例：SH001">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<input id="start" placeholder="起始数字" type="number" value="1">
<input id="count" placeholder="生成数量" type="number" value="20">
</div>
<button onclick="genSku()">生成SKU列表</button>
<textarea id="skuOut" readonly></textarea>
<script>
function genSku(){
    const prefix = document.getElementById('prefix').value.trim();
    const start = parseInt(document.getElementById('start').value);
    const count = parseInt(document.getElementById('count').value);
    let list = [];
    for(let i=0;i<count;i++){
        list.push(prefix+(start+i));
    }
    document.getElementById('skuOut').value = list.join("\n");
}
</script>
</body>
</html>
