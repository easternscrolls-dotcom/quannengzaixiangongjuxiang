<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRT字幕转ASS字幕工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 0}
textarea{width:100%;height:260px;border:1px solid #ddd;padding:12px;border-radius:6px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>SRT字幕转ASS字幕文件</h2>
<div class="upload-box">
<input type="file" accept=".srt" id="srtFile">
</div>
<button onclick="srtToAss()">转换并下载ASS</button>
<textarea id="assOut" readonly></textarea>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let srtBlob = null;
document.getElementById('srtFile').onchange = e=>srtBlob = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function srtToAss(){
  if(!srtBlob) return alert("上传srt字幕文件");
  await loadFFmpeg();
  const buf = new Uint8Array(await srtBlob.arrayBuffer());
  ffmpeg.writeFile("in.srt", buf);
  await ffmpeg.exec(["-i","in.srt","out.ass"]);
  const assData = ffmpeg.readFile("out.ass");
  const text = new TextDecoder().decode(assData);
  document.getElementById("assOut").value = text;
  const blob = new Blob([assData],{type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "字幕.ass";
  a.click();
}
</script>
</body>
</html>
