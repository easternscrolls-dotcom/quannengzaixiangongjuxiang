<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文花式艺术字转换</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
.item{padding:10px;border:1px solid #eee;border-radius:6px;margin:8px 0;cursor:pointer;font-size:18px}
.item:hover{background:#f0f7ff}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>中文花式艺术字体｜小红书昵称、签名文案</h2>
<input id="cnInput" placeholder="输入中文文字">
<button onclick="buildCnFont()">生成字体样式</button>
<div id="cnResult"></div>
<script>
function buildCnFont(){
  const raw = document.getElementById("cnInput").value;
  const list = [
    {title:"圆圈中文",str:raw.split("").map(c=>"⓪①②③④⑤⑥⑦⑧⑨〇一二三四五六七八九十".includes(c)?c:"ⓘ").join("")},
    {title:"两侧装饰",str:"꒰ "+raw+" ꒱"},
    {title:"星光包围",str:"✧ "+raw+" ✧"},
    {title:"波浪分隔",str:"〰 "+raw+" 〰"},
    {title:"云朵装饰",str:"☁︎ "+raw+" ☁︎"}
  ];
  let html = "";
  list.forEach(item=>{
    html += `<div class="item" onclick="copyText('${item.str}')">【${item.title}】${item.str}</div>`;
  })
  document.getElementById("cnResult").innerHTML = html;
}
function copyText(t){
  navigator.clipboard.writeText(t);
  alert("已复制");
}
</script>
</body>
</html>
