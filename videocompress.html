<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地视频压缩减小体积</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>视频压缩（降低码率缩小文件大小）</h2>
<div class="upload-box">
<input type="file" accept="video/*" id="videoFile">
</div>
<select id="qualitySel">
<option value="600k">极限压缩 600kbps</option>
<option value="1200k" selected>均衡压缩 1200kbps</option>
<option value="2500k">轻度压缩 2500kbps</option>
</select>
<button onclick="compressVideo()">开始压缩导出</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let sourceBlob = null;
document.getElementById('videoFile').onchange = e=>sourceBlob = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function compressVideo(){
  if(!sourceBlob) return alert("上传视频文件");
  const bitrate = qualitySel.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await sourceBlob.arrayBuffer());
  ffmpeg.writeFile("in.mp4", buf);
  await ffmpeg.exec(["-i", "in.mp4", "-b:v", bitrate, "-b:a", "128k", "compressed.mp4"]);
  const outData = ffmpeg.readFile("compressed.mp4");
  const blob = new Blob([outData], {type:"video/mp4"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "压缩视频.mp4";
  a.click();
}
</script>
</body>
</html>
