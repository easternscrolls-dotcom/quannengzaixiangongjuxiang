<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF页面旋转工具 90/180/270度旋转</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-size:15px}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>PDF页面批量旋转</h2>
<div class="upload-box">
<input type="file" accept=".pdf" id="pdfFile">
</div>
<select id="rotateDeg">
<option value="90">顺时针旋转90°</option>
<option value="180">旋转180°</option>
<option value="270">逆时针旋转90°</option>
</select>
<button onclick="rotatePdf()">旋转并导出PDF</button>
<script>
const { PDFDocument } = window.PDFLib;
async function rotatePdf(){
  const file = document.getElementById('pdfFile').files[0];
  const deg = Number(document.getElementById('rotateDeg').value);
  if(!file) return alert("上传PDF文件");
  const buf = await file.arrayBuffer();
  const pdf = await PDFDocument.load(buf);
  const total = pdf.getPageCount();
  for(let i=0;i<total;i++){
    const page = pdf.getPage(i);
    page.setRotation(page.getRotation() + deg);
  }
  const outBuf = await pdf.save();
  const blob = new Blob([outBuf],{type:"application/pdf"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "旋转后文档.pdf";
  a.click();
}
</script>
</body>
</html>
