<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片固定比例填充留白工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>图片强制比例填充留白（1:1头像/16:9封面）</h2>
<div class="upload-box">
<input type="file" accept="image/*" id="imgFile">
</div>
<select id="ratioSel">
<option value="1:1">1:1 正方形头像</option>
<option value="16:9">16:9 横版封面</option>
<option value="9:16">9:16 短视频竖版</option>
<option value="4:3">4:3 标准照片</option>
</select>
<input id="fillColor" placeholder="留白填充色 white/black" value="white">
<button onclick="fixRatioImg()">固定比例导出</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let sourceImg = null;
document.getElementById('imgFile').onchange = e=>sourceImg = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function fixRatioImg(){
  if(!sourceImg) return alert("上传图片");
  const ratio = ratioSel.value;
  const fill = fillColor.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await sourceImg.arrayBuffer());
  ffmpeg.writeFile("src.png", buf);
  await ffmpeg.exec(["-i","src.png","-vf",`pad=iw:ih:ow:oh:${fill},setsar=${ratio}`,"ratio_fix.png"]);
  const outBuf = ffmpeg.readFile("ratio_fix.png");
  const blob = new Blob([outBuf],{type:"image/png"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "固定比例图片.png";
  a.click();
}
</script>
</body>
</html>
