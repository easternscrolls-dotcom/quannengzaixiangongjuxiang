<h1 style="margin:16px 0;font-size:22px;">商品图片尺寸规范工具</h1>

<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>商品图片缩放尺寸计算，等比例适配目标画布</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<input id="srcW" placeholder="原图宽度" type="number">
<input id="srcH" placeholder="原图高度" type="number">
</div>
<select id="targetSize">
<option value="800-800">800×800（淘宝主图）</option>
<option value="750-1000">750×1000 3:4</option>
<option value="1080-1080">1080×1080 正方形</option>
<option value="1200-1200">1200×1200 高清主图</option>
</select>
<button onclick="calcGoodsImg()">计算缩放尺寸</button>
<textarea id="imgOut" readonly></textarea>
<script>
function calcGoodsImg(){
    const sw = parseFloat(document.getElementById('srcW').value);
    const sh = parseFloat(document.getElementById('srcH').value);
    const tStr = document.getElementById('targetSize').value;
    const [tw,th] = tStr.split("-").map(Number);
    const scaleW = tw/sw;
    const scaleH = th/sh;
    const scale = Math.min(scaleW,scaleH);
    const outW = Math.round(sw*scale);
    const outH = Math.round(sh*scale);
    let txt = `目标画布：${tw} × ${th}
等比例缩放后图片尺寸：${outW} × ${outH}
建议居中放置，空白区域填充白底`;
    document.getElementById('imgOut').value = txt;
}
</script>

<!-- Cookie弹窗开始 -->
<div id="cookieBox" style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:16px 24px;z-index:9999;display:none;">
    <div style="max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:16px;">

            </p>
        </div>
        <div style="display:flex;gap:10px;">
            <button id="cookieAccept" style="padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;">同意</button>
            <button id="cookieReject" style="padding:8px 18px;background:#eee;color:#333;border:none;border-radius:6px;cursor:pointer;">拒绝</button>
        </div>
    </div>
</div>

<script>
const cookieBox = document.getElementById('cookieBox');
const acceptBtn = document.getElementById('cookieAccept');
const rejectBtn = document.getElementById('cookieReject');
const cookieStatus = localStorage.getItem('cookieConsent');
if (!cookieStatus) {
    cookieBox.style.display = 'block';
}
acceptBtn.onclick = function(){
    localStorage.setItem('cookieConsent','accept');
    cookieBox.style.display = 'none';
};
rejectBtn.onclick = function(){
    localStorage.setItem('cookieConsent','reject');
    cookieBox.style.display = 'none';
};
</script>
