<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}

<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>测试银行卡卡号生成（开发调试模拟数据）</h2>
<input id="bankCount" placeholder="生成数量" type="number" value="10">
<button onclick="genBankCard()">生成测试银行卡号</button>
<textarea id="bankOut" readonly></textarea>
<p style="color:#999">⚠️模拟测试卡号，无法转账支付，禁止金融违规使用</p>
<script>
function rndDigit(){
    return Math.floor(Math.random()*10);
}
function genBankCard(){
    const count = parseInt(document.getElementById('bankCount').value);
    const prefixList = ["622202","622848","622700","622622","621700"];
    const res = [];
    for(let i=0;i<count;i++){
        let num = randItem(prefixList);
        for(let k=0;k<12;k++) num += rndDigit();
        res.push(num);
    }
    document.getElementById('bankOut').value = res.join("\n");
}
function randItem(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}
</script>
</body>
</html>
