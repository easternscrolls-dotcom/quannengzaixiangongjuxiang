<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown表格转CSV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:260px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:8px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>粘贴Markdown表格，导出CSV文件</h2>
<textarea id="mdInput" placeholder="粘贴Markdown表格代码"></textarea>
<button onclick="mdToCsv()">转为CSV并下载</button>
<script>
function mdToCsv(){
  const md = document.getElementById('mdInput').value;
  const lines = md.split(/\r?\n/).filter(s=>s.trim().startsWith("|"));
  const dataArr = [];
  lines.forEach(line=>{
    const cells = line.split("|").map(c=>c.trim()).filter(c=>c!=='');
    if(cells.every(x=>x==='---')) return;
    dataArr.push(cells);
  })
  if(dataArr.length<2) return alert("无法识别有效表格");
  const fields = dataArr[0];
  const rows = dataArr.slice(1).map(r=>{
    const obj = {};
    fields.forEach((f,i)=>obj[f]=r[i]??"");
    return obj;
  })
  const csvTxt = Papa.unparse({fields,data:rows});
  const blob = new Blob([csvTxt],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "md表格导出.csv";
  a.click();
}
</script>
</body>
</html>
