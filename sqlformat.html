<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL格式化美化工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:300px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:Consolas,monospace}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/sql-formatter@12.2.4/dist/sql-formatter.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>SQL语句格式化美化 / SQL压缩一行</h2>
<textarea id="sqlInput" placeholder="粘贴SQL语句"></textarea>
<div class="btn-row">
<button onclick="formatSql()">格式化SQL</button>
<button onclick="compressSql()">压缩单行SQL</button>
</div>
<textarea id="sqlOutput" readonly></textarea>
<script>
function formatSql(){
  const sql = document.getElementById('sqlInput').value;
  try{
    const res = sqlFormatter.format(sql, {indent:"  "});
    document.getElementById('sqlOutput').value = res;
  }catch(e){
    document.getElementById('sqlOutput').value = "格式化失败："+e.message;
  }
}
function compressSql(){
  const sql = document.getElementById('sqlInput').value;
  const oneLine = sql.replace(/\s+/g," ").trim();
  document.getElementById('sqlOutput').value = oneLine;
}
</script>
</body>
</html>
