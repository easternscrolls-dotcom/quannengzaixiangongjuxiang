<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO友好URL标准化生成</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:160px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0;font-family:monospace}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>中文标题转SEO英文短URL（小写、横杠分隔）</h2>
<textarea id="seoUrlInput" placeholder="粘贴文章标题"></textarea>
<button onclick="makeSeoUrl()">生成友好URL</button>
<textarea id="seoUrlOut" readonly></textarea>
<script>
function makeSeoUrl(){
  let txt = document.getElementById('seoUrlInput').value;
  //简易转小写、替换符号为横杠，去除多余符号
  txt = txt.toLowerCase()
    .replace(/[^\u4e00-\u9fa5a-z0-9]/g,"-")
    .replace(/-+/g,"-")
    .replace(/^-|-$/g,"");
  document.getElementById('seoUrlOut').value = txt;
}
</script>
</body>
</html>
