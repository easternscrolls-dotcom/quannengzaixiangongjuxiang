<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多时区时间转换 UTC 北京时间</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0;font-family:monospace}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
button{padding:12px;background:#2478f5;color:#fff;border:none;border-radius:6px;cursor:pointer}
textarea{width:100%;height:180px;padding:12px;border:1px solid #ddd;border-radius:6px;margin-top:10px;font-family:monospace}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>北京时间 ↔ UTC 时间互相转换</h2>
<input id="tzInput" placeholder="如：2026-01-01 12:00:00，留空使用当前时间">
<div class="btn-row">
<button onclick="toUTC()">北京时间 → UTC</button>
<button onclick="toBeijing()">UTC → 北京时间</button>
</div>
<textarea id="tzOutput" readonly></textarea>
<script>
function pad(n){return n<10?"0"+n:n}
function formatDate(d){
  const y=d.getFullYear(),m=pad(d.getMonth()+1),day=pad(d.getDate());
  const h=pad(d.getHours()),mi=pad(d.getMinutes()),s=pad(d.getSeconds());
  return `${y}-${m}-${day} ${h}:${mi}:${s}`;
}
function getInputDate(){
  const s = document.getElementById('tzInput').value.trim();
  if(!s) return new Date();
  return new Date(s);
}
function toUTC(){
  const d = getInputDate();
  if(isNaN(d.getTime())){alert("日期格式错误");return;}
  const utc = new Date(d.getTime() - 8*3600*1000);
  document.getElementById('tzOutput').value = "UTC时间："+formatDate(utc);
}
function toBeijing(){
  const d = getInputDate();
  if(isNaN(d.getTime())){alert("日期格式错误");return;}
  const bj = new Date(d.getTime() + 8*3600*1000);
  document.getElementById('tzOutput').value = "北京时间："+formatDate(bj);
}
</script>
</body>
</html>
