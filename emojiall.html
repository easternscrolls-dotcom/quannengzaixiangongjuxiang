<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全分类Emoji表情一键复制</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
h4{margin:12px 0 8px}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-bottom:20px}
.em{font-size:26px;text-align:center;padding:8px;border:1px solid #eee;border-radius:6px;cursor:pointer}
.em:hover{background:#f0f7ff}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>全分类Emoji表情｜小红书抖音文案一键复制</h2>

<h4>❤️ 心情表情</h4>
<div class="emoji-grid">
<div class="em" onclick="copy('🥰')">🥰</div>
<div class="em" onclick="copy('😆')">😆</div>
<div class="em" onclick="copy('😭')">😭</div>
<div class="em" onclick="copy('😤')">😤</div>
<div class="em" onclick="copy('🥺')">🥺</div>
<div class="em" onclick="copy('😎')">😎</div>
<div class="em" onclick="copy('🤩')">🤩</div>
<div class="em" onclick="copy('😴')">😴</div>
</div>

<h4>✨ 装饰星光</h4>
<div class="emoji-grid">
<div class="em" onclick="copy('✨')">✨</div>
<div class="em" onclick="copy('🌟')">🌟</div>
<div class="em" onclick="copy('💫')">💫</div>
<div class="em" onclick="copy('⚡')">⚡</div>
<div class="em" onclick="copy('🔥')">🔥</div>
<div class="em" onclick="copy('💥')">💥</div>
<div class="em" onclick="copy('🌷')">🌷</div>
<div class="em" onclick="copy('🌸')">🌸</div>
</div>

<h4>📌 标记符号</h4>
<div class="emoji-grid">
<div class="em" onclick="copy('📌')">📌</div>
<div class="em" onclick="copy('✅')">✅</div>
<div class="em" onclick="copy('💡')">💡</div>
<div class="em" onclick="copy('📝')">📝</div>
<div class="em" onclick="copy('🔖')">🔖</div>
<div class="em" onclick="copy('💰')">💰</div>
<div class="em" onclick="copy('🎁')">🎁</div>
<div class="em" onclick="copy('📸')">📸</div>
</div>

<script>
function copy(emoji){
  navigator.clipboard.writeText(emoji);
}
</script>
</body>
</html>
