<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV表格数据去重</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1300px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:10px 0}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>CSV 根据指定列去除重复行</h2>
<div class="upload-box">
<input type="file" accept=".csv" id="csvFile">
</div>
<input id="dedupCol" placeholder="去重依据列名（区分大小写）">
<button onclick="csvDedup()">去重导出CSV</button>
<script>
document.getElementById('csvFile').onchange = async e=>{
  window.csvFileObj = e.target.files[0];
}
async function csvDedup(){
  const colName = document.getElementById('dedupCol').value.trim();
  if(!window.csvFileObj || !colName) return alert("上传文件并填写去重列");
  const text = await window.csvFileObj.text();
  const res = Papa.parse(text,{header:true,skipEmptyLines:true});
  const set = new Set();
  const newData = [];
  for(let row of res.data){
    const key = row[colName];
    if(!set.has(key)){
      set.add(key);
      newData.push(row);
    }
  }
  const csvTxt = Papa.unparse({fields:res.meta.fields,data:newData});
  const blob = new Blob([csvTxt],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "去重表格.csv";
  a.click();
}
</script>
</body>
</html>
