<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片自定义添加文字工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
.grid-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{padding:10px;border:1px solid #ddd;border-radius:6px;margin:6px 0}
textarea{width:100px;height:80px;padding:10px;border:1px solid #ddd;border-radius:6px;margin:8px 0;width:100%}
button{width:100%;padding:13px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>图片自定义文字（坐标、字号、颜色）</h2>
<div class="upload-box">
<input type="file" accept="image/*" id="imgFile">
</div>
<textarea id="drawText" placeholder="输入要添加的文字">测试文字</textarea>
<div class="grid-row">
<input id="txtX" placeholder="文字X坐标" value="50">
<input id="txtY" placeholder="文字Y坐标" value="80">
<input id="txtSize" placeholder="字号" value="36">
<input id="txtColor" placeholder="颜色 white/black/red" value="black">
</div>
<button onclick="drawTextOnImg()">写入文字导出</button>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let imgFile = null;
document.getElementById('imgFile').onchange = e=>imgFile = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function drawTextOnImg(){
  if(!imgFile || !drawText.value.trim()) return alert("上传图片并填写文字");
  const text = drawText.value.trim();
  const x = txtX.value;
  const y = txtY.value;
  const size = txtSize.value;
  const color = txtColor.value;
  await loadFFmpeg();
  const buf = new Uint8Array(await imgFile.arrayBuffer());
  ffmpeg.writeFile("src.png", buf);
  const filter = `drawtext=text='${text}':x=${x}:y=${y}:fontsize=${size}:fontcolor=${color}`;
  await ffmpeg.exec(["-i","src.png","-vf",filter,"text_out.png"]);
  const outBuf = ffmpeg.readFile("text_out.png");
  const blob = new Blob([outBuf],{type:"image/png"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "添加文字图片.png";
  a.click();
}
</script>
</body>
</html>
