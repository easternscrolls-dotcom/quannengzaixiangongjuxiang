<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta标题描述长度检测</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
textarea{width:100%;height:160px;padding:12px;border:1px solid #ddd;border-radius:6px;margin:8px 0;font-family:monospace}
.info{padding:12px;border-radius:6px;margin:10px 0}
.ok{background:#e6f9e6;color:#096609}
.warn{background:#fff9e6;color:#995c00}
.err{background:#ffe6e6;color:#b30000}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>SEO Meta标题、描述字符长度检测</h2>
<h4>Title标题</h4>
<textarea id="metaTitle" oninput="checkMeta()"></textarea>
<h4>Description描述</h4>
<textarea id="metaDesc" oninput="checkMeta()"></textarea>
<div id="metaResult"></div>
<script>
function checkMeta(){
  const title = document.getElementById('metaTitle').value;
  const desc = document.getElementById('metaDesc').value;
  const tLen = title.length;
  const dLen = desc.length;
  let html = "";
  //标题推荐30-60字符
  if(tLen <30) html += `<div class="info warn">标题：${tLen}字符，建议30~60字符，偏短</div>`;
  else if(tLen >60) html += `<div class="info err">标题：${tLen}字符，超出60字符，搜索结果会截断！</div>`;
  else html += `<div class="info ok">标题：${tLen}字符，长度标准</div>`;
  //描述推荐80-160
  if(dLen <80) html += `<div class="info warn">描述：${dLen}字符，建议80~160字符，偏短</div>`;
  else if(dLen >160) html += `<div class="info err">描述：${dLen}字符，超出160字符，容易截断</div>`;
  else html += `<div class="info ok">描述：${dLen}字符，长度标准</div>`;
  document.getElementById('metaResult').innerHTML = html;
}
</script>
</body>
</html>
