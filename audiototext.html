<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频语音转文字识别</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{max-width:1200px;margin:30px auto;padding:0 20px;color:#222}
.back{display:block;margin:20px 0;color:#2478f5;text-decoration:none;font-size:15px}
h2{margin-bottom:24px;color:#111}
.upload-box{border:2px dashed #ccd6e0;padding:50px;text-align:center;margin:16px 0;border-radius:8px}
button{padding:12px 24px;background:#2478f5;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin-bottom:15px}
textarea{width:100%;height:320px;border:1px solid #ddd;border-radius:6px;padding:12px;font-size:15px}
p.tip{color:#e64340;margin:8px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.2/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js"></script>
</head>
<body>
<a href="index.html" class="back">← 返回工具箱首页</a>
<h2>音频转文字（语音识别）</h2>
<p class="tip">仅短音频测试，长音频识别较慢</p>
<div class="upload-box">
<input type="file" accept="audio/*" id="audioFile">
</div>
<button onclick="audioToText()">开始识别文字</button>
<textarea id="textResult" readonly placeholder="识别文字输出"></textarea>
<script>
const { FFmpeg } = FFmpegWASM;
let ffmpeg = null;
let audioFile = null;
document.getElementById('audioFile').onchange = e=>audioFile = e.target.files[0];
async function loadFFmpeg(){
  if(!ffmpeg){
    ffmpeg = new FFmpeg();
    await ffmpeg.load();
  }
}
async function audioToText(){
  if(!audioFile) return alert("上传音频文件");
  await loadFFmpeg();
  const buf = new Uint8Array(await audioFile.arrayBuffer());
  ffmpeg.writeFile("audio_in.mp3", buf);
  await ffmpeg.exec(["-i","audio_in.mp3","-filter:a","volume=3","audio_out.wav"]);
  const wavData = ffmpeg.readFile("audio_out.wav");
  const blob = new Blob([wavData],{type:"audio/wav"});
  const url = URL.createObjectURL(blob);
  const res = await Tesseract.recognize(url, "chi_sim+eng");
  document.getElementById("textResult").value = res.data.text;
}
</script>
</body>
</html>
